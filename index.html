<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --ink:#131820; --ink-2:#434b58; --muted:#737d8b; --line:#e1e5ea; --line-2:#cfd5dd;
  --accent:#2563eb; --accent-ink:#1a4fc4; --accent-soft:#e8f0fe;
  --good:#1d7f47; --good-soft:#dff1e6; --warn:#a66300; --warn-soft:#fbeed6; --bad:#c23636; --bad-soft:#fbe3e3; --idle:#667085; --idle-soft:#eceef2;
  --bar:#2563eb; --bar-muted:#b7d3f6; --shadow:0 8px 30px rgba(20,30,50,.14);
  --cat-aqua:#1baf7a; --cat-aqua-soft:#dbf2e9; --cat-orange:#eb6834; --cat-orange-soft:#fbe4d9; --cat-violet:#4a3aa7; --cat-violet-soft:#e7e3f8;
  --cat-yellow:#eda100; --cat-yellow-soft:#fbedd1; --cat-magenta:#e87ba4; --cat-magenta-soft:#fbe4ec; --cat-green:#008300; --cat-green-soft:#dcefdc;
  --chart-1:#93b4ef; --chart-2:#f3b98d; --chart-3:#8fd0bd; --chart-4:#f2cf8d; --chart-5:#eeaac6; --chart-6:#a9d6a4; --chart-7:#bcb2ec;
  --chart-accent:#8fabe8; --chart-accent-ink:#6f8fd4;
  --card-shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 10px rgba(16,24,40,.06);
  --card-shadow-hover:0 6px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f242c; --ink:#eef1f5; --ink-2:#c3cad4; --muted:#8e98a5; --line:#2a3039; --line-2:#3a424d;
  --accent:#5b93ef; --accent-ink:#93bbf5; --accent-soft:#182a41;
  --good:#45b877; --good-soft:#15301f; --warn:#e2a23c; --warn-soft:#342711; --bad:#ee6b6b; --bad-soft:#3a1b1c; --idle:#9aa3b0; --idle-soft:#262b33;
  --cat-aqua:#199e70; --cat-aqua-soft:#132e26; --cat-orange:#d95926; --cat-orange-soft:#3a2416; --cat-violet:#9085e9; --cat-violet-soft:#241f47;
  --cat-yellow:#c98500; --cat-yellow-soft:#332a10; --cat-magenta:#d55181; --cat-magenta-soft:#3a1f29; --cat-green:#008300; --cat-green-soft:#173517;
  --chart-1:#7fa3e0; --chart-2:#d99f6e; --chart-3:#6fb89f; --chart-4:#cfab60; --chart-5:#cf85a7; --chart-6:#84b87e; --chart-7:#a294dd;
  --chart-accent:#7fa3e0; --chart-accent-ink:#5f85c8;
  --card-shadow:0 1px 2px rgba(0,0,0,.24), 0 2px 10px rgba(0,0,0,.3);
  --card-shadow-hover:0 6px 22px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --bar:#5b93ef; --bar-muted:#1c5cab; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f242c; --ink:#eef1f5; --ink-2:#c3cad4; --muted:#8e98a5; --line:#2a3039; --line-2:#3a424d;
  --accent:#5b93ef; --accent-ink:#93bbf5; --accent-soft:#182a41;
  --good:#45b877; --good-soft:#15301f; --warn:#e2a23c; --warn-soft:#342711; --bad:#ee6b6b; --bad-soft:#3a1b1c; --idle:#9aa3b0; --idle-soft:#262b33;
  --cat-aqua:#199e70; --cat-aqua-soft:#132e26; --cat-orange:#d95926; --cat-orange-soft:#3a2416; --cat-violet:#9085e9; --cat-violet-soft:#241f47;
  --cat-yellow:#c98500; --cat-yellow-soft:#332a10; --cat-magenta:#d55181; --cat-magenta-soft:#3a1f29; --cat-green:#008300; --cat-green-soft:#173517;
  --chart-1:#7fa3e0; --chart-2:#d99f6e; --chart-3:#6fb89f; --chart-4:#cfab60; --chart-5:#cf85a7; --chart-6:#84b87e; --chart-7:#a294dd;
  --chart-accent:#7fa3e0; --chart-accent-ink:#5f85c8;
  --card-shadow:0 1px 2px rgba(0,0,0,.24), 0 2px 10px rgba(0,0,0,.3);
  --card-shadow-hover:0 6px 22px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --bar:#5b93ef; --bar-muted:#1c5cab; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;max-width:1280px;margin:0 auto;justify-content:space-between}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand .titlegrp{display:flex;align-items:center;gap:12px}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .divider{width:1px;height:26px;background:var(--line-2);flex:none;display:block}
.ver-tag{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);letter-spacing:.02em;padding:2px 8px;border-radius:999px;vertical-align:middle}
.authcard .logo{height:34px;width:auto;display:block;margin-bottom:12px}
.whoami{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
.whoami .row{display:flex;align-items:center;gap:10px}
.whoami .cap{color:var(--muted);font-size:12px}
.whoami .role{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1280px;margin:12px auto 0;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid transparent;background:none;font:inherit;color:var(--ink-2);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s,box-shadow .15s,transform .15s}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2);transform:translateY(-1px)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent-soft);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.10)}
nav.tabs button[data-tab="customers"][aria-selected="true"]{color:var(--cat-aqua);background:var(--cat-aqua-soft)}
nav.tabs button[data-tab="sales"][aria-selected="true"]{color:var(--cat-orange);background:var(--cat-orange-soft)}
nav.tabs button[data-tab="products"][aria-selected="true"]{color:var(--cat-violet);background:var(--cat-violet-soft)}
nav.tabs button[data-tab="cityhall"][aria-selected="true"]{color:var(--cat-magenta);background:var(--cat-magenta-soft)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:18px;display:grid;gap:28px}
section.view > *{min-width:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h2{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
h2::before{content:"";display:inline-block;width:4px;height:12px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:middle}
h3{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
.lede{color:var(--ink-2);margin:0;max-width:75ch;line-height:1.6}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;box-shadow:var(--card-shadow);animation:fadeIn .28s ease}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.panel-h .note{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 220%);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px 13px;position:relative;box-shadow:var(--card-shadow);transition:box-shadow .18s ease,transform .18s ease;animation:fadeIn .32s ease}
.kpi:hover{box-shadow:var(--card-shadow-hover);transform:translateY(-2px)}
.kpi:nth-of-type(4n+2){border-left-color:var(--cat-aqua)}
.kpi:nth-of-type(4n+3){border-left-color:var(--cat-orange)}
.kpi:nth-of-type(4n+4){border-left-color:var(--cat-violet)}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:3px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
.hscroll-fixed{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:14px;overflow-x:auto;overflow-y:hidden;background:var(--surface);border-top:1px solid var(--line);z-index:35}
.hscroll-fixed.hide{display:none}
.hscroll-fixed>div{height:1px}
.kpi.click{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.02em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;transition:background-color .1s}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.lnk{color:var(--accent-ink);cursor:pointer;text-decoration:none;border:0;background:none;font:inherit;padding:0;text-align:left}
.lnk:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px 1px 7px;border-radius:999px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-good{color:var(--good);background:var(--good-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-bad{color:var(--bad);background:var(--bad-soft)}
.s-info{color:var(--accent-ink);background:var(--accent-soft)}
.s-idle{color:var(--idle);background:var(--idle-soft)}
.s-umbrella{color:var(--cat-violet);background:var(--cat-violet-soft)}
.pill.b-big{color:var(--cat-orange);background:var(--cat-orange-soft)}
.pill.b-return{color:var(--cat-violet);background:var(--cat-violet-soft)}
.pill.b-first{color:var(--cat-aqua);background:var(--cat-aqua-soft)}
.tag{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:0 6px;white-space:nowrap;line-height:18px}
.period-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 10px 3px 9px;white-space:nowrap}
.count-tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.period-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.stackbar{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.stackbar .seg{height:100%;min-width:2px}
.stackbar-legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:11px;font-size:12.5px}
.stackbar-legend .li{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);max-width:240px}
.stackbar-legend .sw{width:9px;height:9px;border-radius:2.5px;flex:none}
.stackbar-legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stackbar-legend .amt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search],.filters select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;flex-wrap:wrap;box-shadow:var(--card-shadow)}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:7px 13px;cursor:pointer;border-right:1px solid var(--line-2);transition:background-color .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;transition:background-color .12s,box-shadow .12s,transform .12s}
.btn:hover{background:var(--surface-2);box-shadow:var(--card-shadow)}
.btn.primary{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 4px 14px rgba(0,0,0,.24)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.icon-btn{padding:5px 9px;font-size:15px;line-height:1;border-radius:999px;color:var(--ink-2)}
.btn.icon-btn:active{transform:rotate(-40deg);transition:transform .15s}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.grid2 > *{min-width:0}
.status-row{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(240px,1fr);gap:18px}
.status-row > *{min-width:0}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar.click{cursor:pointer;margin-inline:-6px;padding:3px 6px;border-radius:6px}
.hbar.click:hover{background:var(--surface-2)}
.hbar .t{height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.hbar .t b{display:block;height:100%;border-radius:0 8px 8px 0;transition:filter .12s}
.hbar.click:hover .t b{filter:brightness(1.08)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .num{font-weight:600}
.vbars-wrap{overflow-x:auto}
.vbars{display:flex;align-items:flex-end;gap:7px;height:160px;padding-top:10px}
.vbars .col{flex:1 1 0;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vbars .bar{width:62%;background:linear-gradient(180deg,var(--chart-accent) 0%,var(--chart-accent-ink) 100%);border-radius:6px 6px 0 0;min-height:2px;transition:filter .12s}
.vbars .col:hover .bar{filter:brightness(1.08)}
.vbars .lbl{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap}
.vbars .val{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.explain{background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink-2)}
.explain b{color:var(--ink)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
details.help summary{cursor:pointer;color:var(--accent-ink);font-size:13px}
details.help[open] summary{margin-bottom:8px}
dl.defs{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:12.5px}
dl.defs dt{font-weight:600}
dl.defs dd{margin:0;color:var(--ink-2)}
.rowhd{white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-h .ttl{flex:1;min-width:0}
.drawer-h h2{font-size:17px;word-break:keep-all}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;grid-auto-rows:max-content}
.drawer-b > *{min-width:0}
.x{font:inherit;font-size:20px;line-height:1;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.order{border-top:1px solid var(--line);padding:10px 0}
.order:first-child{border-top:0}
.order.click{cursor:pointer;margin-inline:-8px;padding-inline:8px;border-radius:8px}
.order.click:hover{background:var(--surface-2)}
.order-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.order-h .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.order .ship{font-size:12px;color:var(--ink-2);white-space:pre-wrap;word-break:break-all;margin-top:3px}
/* order detail modal */
.omodal-scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50}
.omodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,92vw);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);z-index:51}
.omodal-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.omodal-h .ttl{flex:1;min-width:0}
.omodal-h h3{font-size:16px;word-break:keep-all}
.omodal-b{padding:16px 18px 20px;display:grid;gap:16px}
.info-box{display:grid;background:var(--surface-2);border-radius:12px;overflow:hidden}
.info-row{font-size:13px;display:grid;grid-template-columns:56px 1fr;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
.info-box .info-row:last-child{border-bottom:0}
.info-row .l{color:var(--accent-ink);font-size:11px;font-weight:700;background:var(--accent-soft);border-radius:5px;padding:2px 6px;height:fit-content;white-space:nowrap}
.info-row .v{word-break:break-all;padding-top:1px}
.cphones{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.cphones a{white-space:nowrap;font-size:12.5px}
.contact-phones{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.contact-phones a{color:#fff;text-decoration:none;font-weight:600;border:0;background:var(--good);border-radius:999px;padding:4px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;transition:filter .12s}
.contact-phones a:hover{filter:brightness(1.08)}
.omodal-b .tbl-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.omodal-b .tbl-wrap table{font-size:12.5px}
.omodal-b .tbl-wrap th{background:var(--surface-2)}
.omodal-total{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:13px 15px;border-top:0;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;font-size:15.5px}
.quicklog{display:grid;gap:9px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--cat-aqua-soft)}
.quicklog .qhead{font-size:12.5px;font-weight:700;color:var(--ink)}
.quicklog select,.quicklog textarea{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;background:var(--surface);color:var(--ink)}
.quicklog textarea{width:100%;resize:vertical;min-height:56px}
.log-item{display:grid;gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.log-h .who{font-size:12px;color:var(--muted)}
.log-note{font-size:13px;white-space:pre-wrap}
.log-next{font-size:12px;color:var(--accent-ink)}
.log-del{font-size:11.5px;color:var(--muted);border:0;background:none;cursor:pointer;margin-left:auto}
.log-del:hover{color:var(--bad)}
.log-outcome{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.log-outcome.ok{color:var(--good);background:var(--good-soft)}
.log-outcome.pending{color:var(--warn);background:var(--warn-soft)}
.log-outcome.none{color:var(--muted);background:var(--surface-2)}
.log-form{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--cat-violet-soft)}
.log-form .row{display:flex;flex-wrap:wrap;gap:8px}
.log-form select,.log-form input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface)}
.log-form textarea{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:6px;padding:8px;resize:vertical;min-height:56px;background:var(--surface);color:var(--ink)}
.log-form label.small{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
/* auth */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--accent-soft) 0%,var(--bg) 62%)}
.authcard{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px 28px;box-shadow:0 20px 60px rgba(20,30,50,.18);position:relative;overflow:hidden}
.authcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent) 0%,var(--cat-violet) 100%)}
.authcard h1{font-size:18px;margin:0 0 4px}
.authcard p.lede{margin-bottom:18px}
.authcard label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;margin-top:12px}
.authcard input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;background:var(--surface);color:var(--ink)}
.authcard .err{color:var(--bad);font-size:12.5px;margin-top:10px}
.authcard .ok{color:var(--good);font-size:12.5px;margin-top:10px}
.authcard .switch{margin-top:16px;font-size:12.5px;text-align:center;color:var(--ink-2)}
.hide{display:none !important}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{color:var(--muted);font-size:13px;padding:20px;display:flex;align-items:center;gap:10px}
.spin::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
@media (max-width:640px){
  .hide-sm{display:none}
  body{padding-inline:12px}
  .brand h1{font-size:17px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .status-row{grid-template-columns:1fr}
  .kpi{padding:12px}
  .kpi .v{font-size:17px}
  nav.tabs button{padding:8px 10px 9px;font-size:12.5px}
  .drawer{width:100%}
  .drawer-b{padding:14px 14px calc(32px + env(safe-area-inset-bottom,0px))}
  .panel{padding:13px}
  table{font-size:12.5px}
}
/* ===== v3.0 Executive theme (visual only) ===== */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#f6f8fc; --ink:#0e1a33; --ink-2:#44506b; --muted:#7b86a0; --line:#e6eaf3; --line-2:#d5dbe8;
  --accent:#3d5afe; --accent-ink:#2a41d6; --accent-soft:#e9edff;
  --good:#0e9f6e; --good-soft:#e0f6ee; --warn:#b7791f; --warn-soft:#fdf1da; --bad:#d6405a; --bad-soft:#fde8ec; --idle:#6b7690; --idle-soft:#eceff6;
  --bar:#3d5afe; --bar-muted:#c6d0ff;
  --chart-accent:#6f86ff; --chart-accent-ink:#3d5afe;
  --card-shadow:0 1px 2px rgba(14,26,51,.04), 0 6px 24px rgba(14,26,51,.06);
  --card-shadow-hover:0 10px 32px rgba(14,26,51,.12), 0 2px 8px rgba(14,26,51,.06);
  --radius:18px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0f1d; --surface:#111a2e; --surface-2:#16213a; --ink:#f1f4fb; --ink-2:#b9c3da; --muted:#7f8cab; --line:#1f2b47; --line-2:#2b3a5c;
  --accent:#7b8cff; --accent-ink:#a9b5ff; --accent-soft:#1a2547;
  --good:#3ccf9a; --good-soft:#0f2e28; --warn:#f0b957; --warn-soft:#33260f; --bad:#ff7a8e; --bad-soft:#3a1822; --idle:#98a3bf; --idle-soft:#1b2640;
  --bar:#7b8cff; --bar-muted:#2a3a78; --chart-accent:#8b9aff; --chart-accent-ink:#5f72f0;
  --card-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  --card-shadow-hover:0 12px 36px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
} }
:root[data-theme="dark"]{
  --bg:#0a0f1d; --surface:#111a2e; --surface-2:#16213a; --ink:#f1f4fb; --ink-2:#b9c3da; --muted:#7f8cab; --line:#1f2b47; --line-2:#2b3a5c;
  --accent:#7b8cff; --accent-ink:#a9b5ff; --accent-soft:#1a2547;
  --good:#3ccf9a; --good-soft:#0f2e28; --warn:#f0b957; --warn-soft:#33260f; --bad:#ff7a8e; --bad-soft:#3a1822; --idle:#98a3bf; --idle-soft:#1b2640;
  --bar:#7b8cff; --bar-muted:#2a3a78; --chart-accent:#8b9aff; --chart-accent-ink:#5f72f0;
  --card-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  --card-shadow-hover:0 12px 36px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}
body{background:var(--bg);background-image:radial-gradient(1200px 380px at 12% -80px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(900px 320px at 100% -60px,color-mix(in srgb,var(--cat-violet) 10%,transparent),transparent 70%);background-repeat:no-repeat;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
/* header */
header.top{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ink) 0%,var(--accent-ink) 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ver-tag{-webkit-text-fill-color:var(--accent-ink);background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);letter-spacing:.04em}
nav.tabs{gap:4px;padding:5px;margin-top:10px;margin-bottom:2px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;box-shadow:var(--card-shadow)}
nav.tabs button{padding:8px 18px;font-weight:500;font-size:13.5px;border-radius:999px}
nav.tabs button:hover{transform:none;background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent);font-weight:600}
nav.tabs button[data-tab="customers"][aria-selected="true"],
nav.tabs button[data-tab="sales"][aria-selected="true"],
nav.tabs button[data-tab="products"][aria-selected="true"],
nav.tabs button[data-tab="cityhall"][aria-selected="true"]{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);color:#fff}
/* section titles */
h2{font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center}
h2::before{width:4px;height:16px;background:linear-gradient(180deg,var(--accent),var(--cat-violet));margin-right:10px;border-radius:3px}
/* panels */
.panel{border-radius:var(--radius);padding:22px;border:1px solid color-mix(in srgb,var(--line) 85%,transparent);box-shadow:var(--card-shadow)}
.panel-h{margin-bottom:14px}
/* KPI */
.kpis{gap:14px}
.kpi{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;padding:16px 18px 15px;background:var(--surface);overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 30%,transparent))}
.kpi:nth-of-type(4n+2)::before{background:linear-gradient(90deg,var(--cat-aqua),color-mix(in srgb,var(--cat-aqua) 30%,transparent))}
.kpi:nth-of-type(4n+3)::before{background:linear-gradient(90deg,var(--cat-orange),color-mix(in srgb,var(--cat-orange) 30%,transparent))}
.kpi:nth-of-type(4n+4)::before{background:linear-gradient(90deg,var(--cat-violet),color-mix(in srgb,var(--cat-violet) 30%,transparent))}
.kpi:nth-of-type(n){border-left-color:var(--line)}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:.02em}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.025em;margin-top:6px;line-height:1.15}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:3px}
/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:14px;margin-inline:0;background:var(--surface)}
table{font-size:13px}
th{background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:700;text-transform:none;letter-spacing:.04em;padding:11px 12px;border-bottom:1px solid var(--line-2)}
td{padding:12px;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even) td{background:transparent}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
tr.click:hover td{background:var(--accent-soft)}
.lnk{color:var(--accent-ink);font-weight:600}
.lnk:hover{text-decoration:none;color:var(--accent)}
/* pills */
.pill{font-size:11.5px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;line-height:16px;letter-spacing:0;border:1px solid color-mix(in srgb,currentColor 16%,transparent)}
.pill::before{width:7px;height:7px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.tag{border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.period-tag,.count-tag{border:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}
/* inputs, buttons */
.filters input[type=search],.filters select,.log-form select,.log-form input[type=date],.quicklog select{border-radius:12px;padding:9px 13px;border:1px solid var(--line-2);background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.filters input[type=search]:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);outline:0}
.btn{border-radius:12px;padding:8px 14px;font-weight:600;border-color:var(--line-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-ink));border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.icon-btn{border-radius:999px;padding:6px 10px}
.seg{border-radius:14px;box-shadow:none;background:var(--surface-2);padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:11px;padding:7px 14px;font-weight:500}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);font-weight:700;box-shadow:0 1px 3px rgba(14,26,51,.12),0 0 0 1px var(--line)}
.chip{border-radius:999px;padding:5px 13px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
/* bars */
.hbar .t{height:12px;border-radius:999px;background:var(--surface-2)}
.hbar .t b{border-radius:999px;background-image:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.22))}
.hbar.click:hover{background:var(--surface-2);border-radius:10px}
.vbars .bar{width:58%;border-radius:8px 8px 3px 3px}
.stackbar{height:14px;border-radius:999px;gap:3px;background:var(--surface-2)}
.stackbar .seg{border-radius:999px}
.explain{border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
/* drawer / modal */
.scrim{background:rgba(8,13,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.drawer{border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(8,13,28,.28)}
.drawer-h{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.omodal{border-radius:20px;border:1px solid var(--line)}
.omodal-scrim{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.omodal-total{background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff}
.info-box{border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.quicklog,.log-form{border-radius:14px}
.toast{border-radius:12px;box-shadow:var(--shadow)}
/* auth */
.authwrap{background:radial-gradient(900px 500px at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%),radial-gradient(800px 500px at 90% 90%,color-mix(in srgb,var(--cat-violet) 18%,transparent),transparent 65%),var(--bg)}
.authcard{border-radius:24px;box-shadow:0 30px 80px rgba(14,26,51,.22)}
.authcard input{border-radius:12px;padding:11px 13px}
.stackbar .seg{padding:0;border:0;box-shadow:none;display:block;overflow:visible}
/* 시청 표: 담당자 전화 */
.cphones a{font-weight:600}
@media (max-width:640px){
  nav.tabs{width:100%;border-radius:18px}
  nav.tabs button{padding:8px 13px}
  .panel{padding:16px;border-radius:16px}
  .kpi .v{font-size:20px}
}

/* 오늘의 영업대상 */
.today-dot{font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:2px}
.chip[aria-pressed="true"] .muted{color:rgba(255,255,255,.75)}
.outbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.outbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer;transition:background-color .12s,color .12s,border-color .12s,transform .1s}
.outbtn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.outbtn.good:hover{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.outbtn.bad:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.outbtn:active{transform:scale(.96)}
.outbtn:disabled{opacity:.5;cursor:default}
tr.done-row{opacity:.35;transition:opacity .3s}
/* ===== 거래명세서 (종이 양식) ===== */
#stmtPrintRoot{display:none}
.stm{background:#fff;color:#000;font-family:'Gulim','굴림','Dotum','돋움','IBM Plex Sans KR','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:8.6pt;line-height:1.3}
.stm *{box-sizing:border-box}
.stm table{border-collapse:collapse;width:100%;font-size:inherit;background:#fff}
.stm th,.stm td{border:1px solid #000;padding:.6mm 1.2mm;vertical-align:middle;color:#000;font-size:inherit;letter-spacing:0;white-space:normal;text-transform:none;transition:none;position:static}
.stm th{background:#f2f2f2 !important;font-weight:700;text-align:center;white-space:nowrap}
.stm tbody tr td,.stm tbody tr:nth-child(even) td,.stm tbody tr:hover td{background:#fff !important}
.stm .stm-page{width:192mm;height:281mm;display:flex;flex-direction:column;justify-content:space-between;background:#fff}
.stm .stm-blk{height:136.5mm;display:flex;flex-direction:column;gap:0}
.stm .stm-sep{border-top:1px dashed #888}
.stm .stm-top{display:flex;gap:0;height:25mm;margin-bottom:2mm}
.stm .stm-lhs{width:46%;display:flex;flex-direction:column;justify-content:space-between}
.stm .stm-ttl{font-size:17pt;font-weight:700;text-align:center;letter-spacing:.1em;padding-top:1mm}
.stm .stm-to{border:1px solid #000;padding:2mm 2.5mm;font-size:10.5pt;font-weight:700;line-height:1.3;min-height:13mm;display:flex;align-items:center;flex-wrap:wrap}
.stm .stm-gj{font-size:8pt;margin-left:2mm;white-space:nowrap}
.stm .stm-sup{width:calc(54% + 1px);margin-left:-1px;height:25mm;font-size:8pt}
.stm .stm-sup .vh{width:5mm;text-align:center;font-weight:700;background:#f2f2f2 !important;line-height:1.5;padding:0}
.stm .stm-sup .tfv{text-align:center;line-height:1.4}
.stm .stm-sup .b{font-weight:700}
.stm .stm-sum{border:1.4px solid #000;display:flex;justify-content:space-between;align-items:center;padding:1.6mm 4mm;font-size:11.5pt;font-weight:700;margin-bottom:2mm}
.stm .stm-it th{padding:1.2mm}
.stm .stm-it td{height:5mm;padding:.2mm 1.2mm}
.stm .stm-it td.c{text-align:center}.stm .stm-it td.r{text-align:right}.stm .stm-it td.l{text-align:left;font-size:7.8pt;line-height:1.15}.stm .stm-it td.sm{font-size:6.6pt;line-height:1.15}
.stm .stm-tot{margin-top:1.6mm}.stm .stm-inf{margin-top:1.6mm}
.stm tbody tr:last-child td,.stm tbody tr:last-child th{border-bottom:1px solid #000}
.stm tr:first-child th,.stm tr:first-child td{border-top:1px solid #000}
.stm .gr th,.stm .gr td{border-color:#a0a0a0}
.stm .gr tr>*:first-child{border-left-color:#000}.stm .gr tr>*:last-child{border-right-color:#000}
.stm .gr tr:first-child>*{border-top-color:#000}.stm .gr tr:last-child>*{border-bottom-color:#000}
.stm .stm-it thead th{border-bottom-color:#555;background:#efefef !important}
.stm .stm-tot{table-layout:fixed}
.stm .stm-tot th,.stm .stm-tot td{height:7mm;padding:0 1.6mm;border-top-width:1.4px;border-bottom-width:1.4px;background:#fff}
.stm .stm-tot th{background:#ececec !important;font-size:10.5pt;font-weight:700}
.stm .stm-tot th.sm{font-size:7pt;font-weight:400;letter-spacing:-.02em;padding:0}
.stm .stm-tot td{font-size:9.5pt}.stm .stm-tot td.r{text-align:right;padding-right:2mm}
.stm .stm-tot tr>*:first-child{border-left-width:1.4px}.stm .stm-tot tr>*:last-child{border-right-width:1.4px}
.stm .stm-inf{table-layout:fixed}
.stm .stm-inf th{width:24mm;background:#ececec !important;font-weight:400;font-size:8pt;padding:0 1mm}
.stm .stm-inf th.w2{width:14mm}
.stm .stm-inf td{height:5.6mm;font-size:8pt;padding:0 1.6mm}
.stm .stm-inf tr.tall td,.stm .stm-inf tr.tall th{height:9mm}
.stm .stm-inf tr:nth-child(-n+2)>*{border-bottom-color:#000}
/* 화면 미리보기: 종이처럼 보이게 */
.stm-preview{display:grid;gap:14px;justify-content:center;overflow-x:auto;padding:4px}
.stm-preview .stm-page{box-shadow:0 2px 14px rgba(14,26,51,.22);padding:8mm 9mm;width:210mm;height:297mm;border-radius:2px}
@media (max-width:900px){ .stm-preview{justify-content:start} .stm-preview .stm-page{zoom:.62} }
@media (max-width:480px){ .stm-preview .stm-page{zoom:.46} }
@media print{
  @page{size:A4;margin:8mm 9mm}
  html,body{background:#fff !important;background-image:none !important;padding:0 !important;margin:0 !important}
  body > *:not(#stmtPrintRoot){display:none !important}
  #stmtPrintRoot{display:block !important}
  #stmtPrintRoot .stm .stm-page{page-break-after:always;break-after:page;box-shadow:none}
  #stmtPrintRoot .stm .stm-page:last-child{page-break-after:auto;break-after:auto}
  .stm{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.stm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;max-height:150px;overflow-y:auto}
.stm-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:999px;padding:3px 4px 3px 11px;white-space:nowrap}
.stm-chip b{font-variant-numeric:tabular-nums}
.stm-x{font:inherit;font-size:14px;line-height:1;border:0;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-ink);border-radius:999px;width:20px;height:20px;cursor:pointer;padding:0}
.stm-x:hover{background:var(--bad);color:#fff}
tr.stm-in td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent) !important}
.stm-cartbox{border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
</style>
</head>

    <h1>거래처 주문 레이더</h1>
    <p class="lede small">팀 계정으로 로그인하세요.</p>
    <div id="loginBox">
      <label>이메일</label>
      <input id="li-email" type="email" autocomplete="username">
      <label>비밀번호</label>
      <input id="li-pw" type="password" autocomplete="current-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-login" style="flex:1">로그인</button>
      </div>
      <div class="switch">아직 계정이 없나요? <a href="#" id="go-signup" class="lnk">가입하기</a> · <a href="#" id="go-forgot" class="lnk">비밀번호를 잊으셨나요?</a></div>
      <div id="loginMsg"></div>
    </div>
    <div id="signupBox" class="hide">
      <label>이름</label>
      <input id="su-name" type="text" autocomplete="name">
      <label>이메일</label>
      <input id="su-email" type="email" autocomplete="username">
      <label>비밀번호 (6자 이상)</label>
      <input id="su-pw" type="password" autocomplete="new-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-signup" style="flex:1">가입하기</button>
      </div>
      <div class="switch">이미 계정이 있나요? <a href="#" id="go-login" class="lnk">로그인</a></div>
      <div id="signupMsg"></div>
    </div>
    <div id="forgotBox" class="hide">
      <p class="lede small">가입할 때 쓴 이메일을 입력하면 비밀번호 재설정 링크를 보내드려요.</p>
      <label>이메일</label>
      <input id="fp-email" type="email" autocomplete="username">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-forgot" style="flex:1">재설정 링크 보내기</button>
      </div>
      <div class="switch"><a href="#" id="go-login-2" class="lnk">로그인으로 돌아가기</a></div>
      <div id="forgotMsg"></div>
    </div>
    <div id="resetBox" class="hide">
      <p class="lede small">새 비밀번호를 설정하세요.</p>
      <label>새 비밀번호 (6자 이상)</label>
      <input id="rp-pw" type="password" autocomplete="new-password">
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" id="btn-reset" style="flex:1">비밀번호 변경</button>
      </div>
      <div id="resetMsg"></div>
    </div>

const won = n => (n==null? '-' : Math.round(n).toLocaleString('ko-KR')+'원');
const num = n => (n==null? '-' : Math.round(n).toLocaleString('ko-KR'));
const fmtDate = d => d ? d : '-';
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eok = n => ((Number(n)||0)/1e8).toFixed(2)+'억';
function daysAgoStr(n){ if(n==null) return '-'; if(n<=0) return '오늘'; return n+'일 전'; }
// 주문서의 담당자 필드는 "김성준 010-2914-2422", "백마리아 차장 02-399-1082 / 010-5282-8548",
// "복지후생담당관실 박준우 행정관 02-3480-1942/010-2387-5635" 처럼 이름(+직함/부서)과 전화번호가
// 한 줄에 자유롭게 섞여 있어서, 전화번호만 뽑아내 바로 누를 수 있는 링크로 만들고 나머지를 담당자 이름으로 씀.
function parseContact(raw){
  if(!raw || !String(raw).trim()) return null;
  const s = String(raw).trim();
  const phoneRe = /(01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}|0[2-6][0-9]?[-.\s]?\d{3,4}[-.\s]?\d{4})/g;
  const phones = [...new Set((s.match(phoneRe)||[]).map(p=>p.trim()))];
  let name = s;
  phones.forEach(p=>{ name = name.split(p).join(' '); });
  name = name.replace(/[\/,·]/g,' ').replace(/\s+/g,' ').trim();
  return {name, phones, raw:s};
}
function shortSupplier(n){
  n=String(n||'').replace(/^ZZ-/,'').trim();
  return n.replace(/^사단법인\s*/,'').replace(/장애인(직업휴먼|일자리)센터$/,'').replace(/팩토리$/,'').replace(/\s*서울지사$/,'').replace(/^한국나눔복지연합회$/,'나눔복지연합회').trim()||n;
}
function contactCell(raw){
  const c = parseContact(raw);
  if(!c) return '<span class="small muted">-</span>';
  // 전화번호는 하이픈에서 줄바꿈되지 않게 한 덩어리로 두고, 번호가 여러 개면 한 줄에 하나씩 보여줘요(모바일 가독성).
  const phones = c.phones.length ? `<div class="cphones">${c.phones.map(p=>`<a href="tel:${p.replace(/[^0-9]/g,'')}">${esc(p)}</a>`).join('')}</div>` : '';
  return `<div class="small">${esc(c.name||'-')||'<span class=\"muted\">-</span>'}</div>${phones}`;
}
// 가로로 넓은 표(시청 탭 등)는 표 자체의 가로 스크롤바가 화면 맨 아래(표 끝)에 있어서
// 스크롤을 한참 내려야만 보여요 — 그래서 화면 하단에 고정된 별도 스크롤바를 만들어서
// 표의 스크롤과 서로 동기화시켜요. 화면 어디서든 바로 가로로 이동할 수 있게.
let hscrollWrap = null;
function syncHScrollBar(){
  const bar = document.getElementById('hscrollBar');
  const inner = document.getElementById('hscrollBarInner');
  if(!hscrollWrap || !hscrollWrap.isConnected){ bar.classList.add('hide'); return; }
  const need = hscrollWrap.scrollWidth > hscrollWrap.clientWidth + 2;
  bar.classList.toggle('hide', !need);
  inner.style.width = hscrollWrap.scrollWidth + 'px';
  bar.scrollLeft = hscrollWrap.scrollLeft;
}
function bindStickyHScroll(wrapEl){
  hscrollWrap = wrapEl;
  const bar = document.getElementById('hscrollBar');
  let syncing = false;
  wrapEl.onscroll = ()=>{ if(syncing) return; syncing=true; bar.scrollLeft = wrapEl.scrollLeft; syncing=false; };
  bar.onscroll = ()=>{ if(syncing) return; syncing=true; wrapEl.scrollLeft = bar.scrollLeft; syncing=false; };
  syncHScrollBar();
}
function unbindStickyHScroll(){
  hscrollWrap = null;
  document.getElementById('hscrollBar').classList.add('hide');
}
window.addEventListener('resize', ()=>{ if(hscrollWrap) syncHScrollBar(); });
function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 1800);
}
function copyTSV(rows, label){
  const txt = rows.map(r=>r.map(v=>String(v??'').replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n');
  const done = () => toast(`${label} ${rows.length-1}행 복사됨 · 엑셀에 붙여넣기 하세요`);
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 막혀 있어요. 표를 드래그해서 복사하세요'); }
    ta.remove();
  }
}

(function(){
  const THEME_LABEL = {auto:'자동', light:'라이트', dark:'다크'};
  const THEME_ICON = {auto:'🌓', light:'☀️', dark:'🌙'};
  const btn = document.getElementById('btn-theme');
  function currentTheme(){
    try{ const t = localStorage.getItem('theme'); return (t==='light'||t==='dark') ? t : 'auto'; }catch(e){ return 'auto'; }
  }
  function applyTheme(t){
    if(t==='light' || t==='dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = THEME_ICON[t];
    btn.title = '테마: ' + THEME_LABEL[t] + ' (눌러서 전환)';
  }
  applyTheme(currentTheme());
  btn.onclick = ()=>{
    const order = ['auto','light','dark'];
    const next = order[(order.indexOf(currentTheme())+1) % order.length];
    try{ if(next==='auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', next); }catch(e){}
    applyTheme(next);
  };
})();

// ---------------- shared chart helpers ----------------
// opts.cat=true: 서로 다른 항목(유형 등)을 구분하는 목적이면 항목마다 다른 색(카테고리 색)을 씀.
// opts.cat 없으면(기본): 순위 비교가 목적이라 한 가지 색(블루)의 짙기만 순위에 따라 달라짐 — 1위가 가장 진함.
const CAT_HUES = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','var(--chart-6)','var(--chart-7)'];
function hbars(rows, opts){
  opts = opts || {};
  const max = opts.max || Math.max(...rows.map(r=>r.v),1);
  const n = rows.length;
  return `<div class="hbars">${rows.map((r,i)=>{
    const color = opts.cat ? CAT_HUES[i % CAT_HUES.length] : 'var(--chart-accent)';
    const op = opts.cat ? 1 : Math.max(0.4, 1 - (n>1? i/(n-1) : 0)*0.55).toFixed(2);
    return `<div class="hbar${r.id!=null?' click':''}"${r.id!=null?` data-hb-id="${r.id}"`:''}><span class="nm" title="${esc(r.n)}">${esc(r.n)}</span><span class="t"><b style="width:${Math.max(0,r.v/max*100).toFixed(1)}%;background:${color};opacity:${op}"></b></span><span class="num small">${r.s}</span></div>`;
  }).join('')}</div>`;
}
// 품목별 매출 비중을 가로 스택바(한 줄 누적 막대)로 보여줌 — 순위표는 이미 hbars로 쓰고 있어서,
// "부분 대 전체" 구성비를 보여줄 땐 파이차트 대신 스택바 형태로 다르게 표현.
function stackbar(rows, capN){
  capN = capN || 7;
  const CAT = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','var(--chart-6)','var(--chart-7)'];
  const sorted = rows.slice().sort((a,b)=>b.v-a.v);
  const top = sorted.slice(0, capN);
  const restRows = sorted.slice(capN);
  const restSum = restRows.reduce((s,r)=>s+r.v,0);
  const total = sorted.reduce((s,r)=>s+r.v,0) || 1;
  const items = top.map((r,i)=>({n:r.n, v:r.v, c:CAT[i % CAT.length]}));
  if(restSum>0) items.push({n:`기타 ${restRows.length}개`, v:restSum, c:'var(--idle)'});
  return `
  <div class="stackbar">${items.map(it=>`<div class="seg" style="width:${Math.max(0.6,it.v/total*100).toFixed(2)}%;background:${it.c}" title="${esc(it.n)} · ${won(it.v)} (${(it.v/total*100).toFixed(1)}%)"></div>`).join('')}</div>
  <div class="stackbar-legend">${items.map(it=>`<span class="li"><span class="sw" style="background:${it.c}"></span><span class="nm" title="${esc(it.n)}">${esc(it.n)}</span><span class="amt">${(it.v/total*100).toFixed(0)}%</span></span>`).join('')}</div>`;
}
function monthBars(rows){

    const amt = Number(r.amount)||0;
    const h = Math.max(2, Math.round(amt/max*140));

}

// ---------------- generic year-range helpers (요약 차트 · 거래처 상세 차트 공용) ----------------
function monthYears(monthsArr){ return [...new Set((monthsArr||[]).map(m=>m.month.slice(0,4)))]; }
function monthYearBounds(monthsArr, y){
  let a=-1,b=-1;
  (monthsArr||[]).forEach((m,i)=>{ if(m.month.slice(0,4)===y){ if(a<0)a=i; b=i+1; } });
  return [a,b];
}
function monthRangeBounds(monthsArr, range){
  const n = (monthsArr||[]).length;
  const years = monthYears(monthsArr);
  if(range==='recent') return [Math.max(0, n-12), n];
  if(range==='all' || !years.includes(range)) return [0, n];
  return monthYearBounds(monthsArr, range);
}
function monthRangeChips(monthsArr, range, segId){
  const years = monthYears(monthsArr);
  if(years.length<=1) return '';
  const n = (monthsArr||[]).length;
  const opts = [['recent','최근 12개월'], ...years.map(y=>[y,y+'년']), ['all',`전체(${n}개월)`]];
  return `<div class="seg" id="${segId}">${opts.map(([k,label])=>`<button data-yr="${k}" aria-pressed="${range===k}">${label}</button>`).join('')}</div>`;
}

// ---------------- 품목 이름 정리 (특가/공동구매 등 태그 제거 후 동일 품목 합산) ----------------
// "특가(25년강남서초연간)-복사용지 A4/80g [2,500매]", "복사용지 A4/80g - 공동구매 [2,500매]",
// "복사용지 A4/80g(2,500매) [2,500매]" 처럼 실제로는 같은 품목인데 주문서에 붙는 태그·중복 표기 때문에
// 다른 이름으로 집계되던 것들을 하나로 합쳐서 보여주기 위한 정리 함수. 무게·규격·친환경 여부처럼
// 실제로 다른 품목을 가리키는 표기는 건드리지 않는다.
function normalizeItemName(raw){
  const s = String(raw||'').trim();
  const m = s.match(/^(.*?)(\s*\[[^\]]+\])?$/s);
  let base = (m && m[1] ? m[1] : s).trim();
  const bracket = (m && m[2]) ? m[2].trim() : '';
  base = base.replace(/^특가\([^)]*\)\s*-\s*/, '').replace(/^특가\s*-\s*/, '');
  base = base.replace(/\s*-\s*(공동구매|교육청)\s*$/, '');
  if(bracket){
    const bc = bracket.replace(/^\[|\]$/g, '').trim();
    const escRe = bc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    base = base.replace(new RegExp('\\(' + escRe + '\\)\\s*$'), '').trim();
  }
  return bracket ? (base + ' ' + bracket) : base;
}
let itemTotalsCache = null;
async function ensureItemTotalsLoaded(){
  if(itemTotalsCache) return itemTotalsCache;
  const {data, error} = await sb.from('item_totals').select('*').order('amount', {ascending:false}).limit(1500);
  if(error){ itemTotalsCache = []; throw error; }
  itemTotalsCache = data || [];
  return itemTotalsCache;
}
function topMergedItems(rows, n){
  const byName = new Map();
  (rows||[]).forEach(r=>{
    const key = normalizeItemName(r.item_name);
    if(!byName.has(key)) byName.set(key, {item_name:key, amount:0, qty:0});
    const e = byName.get(key);
    e.amount += Number(r.amount)||0;
    e.qty += Number(r.qty)||0;
  });
  return [...byName.values()].sort((a,b)=>b.amount-a.amount).slice(0,n);
}

let summaryRange = 'recent';
let summaryGroupBy = '유형별'; // '유형별' | '거래처별'

// 유형별/거래처별 누적매출 상위 랭킹 계산. 연도(2024/2025/2026)가 선택된 경우엔 그 해 실적만으로,
// '최근 12개월'·'전체'가 선택된 경우엔 (연도별 집계로는 정확히 재현할 수 없어) 전체 기간 누적으로 계산.
function summaryByType(range){
  const yr = ['2024','2025','2026'].includes(range) ? Number(range) : null;
  const amtByCust = yr!=null ? new Map((custYearTotals||[]).filter(r=>r.year===yr).map(r=>[r.customer_id, Number(r.total_amount)||0])) : null;
  const byType = {};
  CUSTS.forEach(c=>{
    let t = c.ctype || '미분류';
    if(t==='초등학교' || t==='유치원·어린이집') t = '초등학교·유치원';
    const amt = yr!=null ? (amtByCust.get(c.customer_id)||0) : (Number(c.total_amount)||0);
    if(amt>0) byType[t] = (byType[t]||0) + amt;
  });
  return byType;
}
// 선택한 기간(연도)에 실제 주문이 있었던 거래처 수. '최근12개월'·'전체'는 summaryByType과 같은 이유로
// 연도별 집계로 정확히 재현할 수 없어 전체 누적 거래처 수(CUSTS.length)로 계산.
function summaryCustomerCount(range){
  const yr = ['2024','2025','2026'].includes(range) ? Number(range) : null;
  if(yr!=null){
    const ids = new Set((custYearTotals||[]).filter(r=>r.year===yr && Number(r.total_amount)>0).map(r=>r.customer_id));
    return ids.size;
  }
  return CUSTS.length;
}
function summaryTopCustomers(range, n){
  const yr = ['2024','2025','2026'].includes(range) ? Number(range) : null;
  if(yr!=null){
    return (custYearTotals||[]).filter(r=>r.year===yr && Number(r.total_amount)>0)
      .sort((a,b)=>Number(b.total_amount)-Number(a.total_amount)).slice(0,n)
      .map(r=>{ const c = custById.get(r.customer_id); return {n:(c&&c.name)||`#${r.customer_id}`, v:Number(r.total_amount)||0, s:won(r.total_amount), id:r.customer_id}; });
  }
  return CUSTS.slice().sort((a,b)=>(Number(b.total_amount)||0)-(Number(a.total_amount)||0)).slice(0,n)
    .map(c=>({n:c.name, v:Number(c.total_amount)||0, s:won(c.total_amount), id:c.customer_id}));
}

async function renderSummaryView(){
  const el = document.getElementById('view-summary');
  el.innerHTML = '<div class="spin">불러오는 중...</div>';
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const nowYM = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const dayOfMonth = now.getDate();
  const startCur = `${nowYM}-01`;
  const nextD = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const startNext = `${nextD.getFullYear()}-${pad(nextD.getMonth()+1)}-01`;
  let itemRows = [], monthActs = [], monthOrders = [];
  try{
    const [, items, , actsRes, notableRes] = await Promise.all([
      ensureMonthsLoaded(), ensureItemTotalsLoaded(), ensureCustYearTotalsLoaded(),
      sb.from('activities').select('id,kind,customer_id,note,created_at,customers(name)')
        .gte('created_at', startCur).lt('created_at', startNext)
        .order('created_at', {ascending:false}).limit(300),
      sb.from('order_notability').select('*')
        .gte('order_date', startCur).lt('order_date', startNext)
        .order('amount', {ascending:false}).limit(500)
    ]);
    itemRows = items;
    monthActs = (actsRes && actsRes.data) || [];
    monthOrders = (notableRes && notableRes.data) || [];
  }
  catch(error){ el.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  const byStatus = {}; CUSTS.forEach(c=>byStatus[c.status]=(byStatus[c.status]||0)+1);
  const topItems = topMergedItems(itemRows, 40);
  const [a,b] = monthRangeBounds(summaryMonths, summaryRange);
  const chartRows = summaryMonths.slice(a,b);
  // KPI의 "주문금액"·"주문"은 선택한 기간(최근12개월/연도/전체) 동안의 실적으로 계산 — monthly_order_totals가
  // 이미 월별 금액·건수를 갖고 있어서, 그 기간에 해당하는 월들만 더하면 됨.
  const rangeAmount = chartRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const rangeOrders = chartRows.reduce((s,r)=>s+(Number(r.order_count)||0),0);
  const byType = summaryByType(summaryRange);
  const topCustomers = summaryTopCustomers(summaryRange, 10);
  const rangeCustCount = summaryCustomerCount(summaryRange);
  const curIdx = (summaryMonths||[]).findIndex(r=>r.month.slice(0,7)===nowYM);
  const curMonthRow = curIdx>=0 ? summaryMonths[curIdx] : {amount:0, order_count:0};
  const prevMonthRow = curIdx>0 ? summaryMonths[curIdx-1] : null;
  const momBadge = (cur, prev)=>{
    const c = Number(cur)||0, p = Number(prev)||0;
    if(!p) return '';
    const pct = (c-p)/p*100, up = pct>=0;
    return `<span style="color:${up?'var(--good)':'var(--bad)'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
  };
  const amtDelta = momBadge(curMonthRow.amount, prevMonthRow && prevMonthRow.amount);
  const cntDelta = momBadge(curMonthRow.order_count, prevMonthRow && prevMonthRow.order_count);
  // 이번달 신규 거래처(첫 주문이 이번달) — customer_stats.first_date 기준, CUSTS는 이미 전량 로드돼 있음

  // 1) 금액 자체가 크거나 그 거래처 평소 평균보다 훨씬 큰 주문, 2) 한동안 뜸했던 거래처가 다시 주문, 3) 꽤 큰 금액으로 시작한 첫 거래.
  const NOTABLE_BIG_ABS = 20000000, NOTABLE_BIG_REL = 2.5, NOTABLE_RETURN_GAP = 120, NOTABLE_FIRST_MIN = 5000000;
  const notableOrders = monthOrders.map(o=>{
    const amt = Number(o.amount)||0, avg = Number(o.cust_avg_amount)||0, n = Number(o.cust_order_n)||0;
    const gap = o.gap_days!=null ? Number(o.gap_days) : null;
    const badges = [], why = [];
    if(amt>=NOTABLE_BIG_ABS || (n>1 && avg>0 && amt>=avg*NOTABLE_BIG_REL)){
      badges.push({cls:'b-big', label:'고액 주문'});

    }
    if(gap!=null && gap>=NOTABLE_RETURN_GAP){
      badges.push({cls:'b-return', label:`${Math.round(gap/30)}개월만에 복귀`});
      why.push(`직전 주문(${o.prev_order_date}) 이후 ${num(gap)}일만`);
    }
    if(o.prev_order_date==null && amt>=NOTABLE_FIRST_MIN){
      badges.push({cls:'b-first', label:'첫 거래'});
      why.push('이 거래처와의 첫 주문');
    }
    if(!badges.length) return null;
    return {customer_id:o.customer_id, customer_name:o.customer_name, order_date:o.order_date, amount:amt, badges, why: why.join(' · ')};
  }).filter(Boolean).sort((x,y)=>y.amount-x.amount).slice(0,6);
  el.innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="l">주문금액 (${rangeLabel(summaryRange)})</div><div class="v">${won(rangeAmount)}</div></div>

    <div class="kpi"><div class="l">주문 (${rangeLabel(summaryRange)})</div><div class="v">${num(rangeOrders)}건</div></div>
    <div class="kpi click" data-goto-core="1"><div class="l">주문 늦어진 거래처</div><div class="v" style="color:var(--bad)">${num((byStatus['이탈의심']||0)+(byStatus['주의']||0))}곳</div><div class="s">🔥 오늘의 영업대상 보기 →</div></div>
  </div>
  <div class="panel">
    <div class="panel-h"><h2>월별 주문금액</h2><span class="period-tag">${chartRows.length}개월</span></div>
    ${monthRangeChips(summaryMonths, summaryRange, 'summarySeg')}
    ${chartRows.length? monthBars(chartRows) : '<p class="small muted">데이터가 없습니다.</p>'}
    ${monthTable(chartRows)}
  </div>
  <div class="status-row">
  <div class="panel"><div class="panel-h"><h2>거래처 상태 분포</h2><span class="period-tag">기준일 ${todayStr()}</span></div>
    <div class="chip-row">${Object.entries(byStatus).sort((a,b)=>{const ia=STATUS_ORDER.indexOf(a[0]),ib=STATUS_ORDER.indexOf(b[0]);return (ia<0?999:ia)-(ib<0?999:ib);}).map(([k,v])=>`<button class="chip" data-goto-st="${esc(k)}">${statusPill(k)} ${v}곳</button>`).join('')}</div>
    ${statusHelpBlock()}
  </div>
  <div class="panel"><div class="panel-h"><h2>당월 주문 현황</h2><span class="period-tag">${esc(nowYM)} · ${dayOfMonth}일째</span></div>
    <div class="kpis">
      <div class="kpi"><div class="l">당월 주문금액</div><div class="v" title="${won(curMonthRow.amount)}">${eok(curMonthRow.amount)}원</div>${amtDelta?`<div class="s">전월 대비 ${amtDelta}</div>`:''}</div>
      <div class="kpi"><div class="l">당월 주문수</div><div class="v">${num(curMonthRow.order_count)}건</div>${cntDelta?`<div class="s">전월 대비 ${cntDelta}</div>`:''}</div>
    </div>
    ${Number(curMonthRow.amount)?'':'<p class="small muted" style="margin-top:10px">이번 달 주문 데이터가 아직 없어요.</p>'}
  </div>
  </div>
  <div class="panel"><div class="panel-h"><h2>이번달 주목할 만한 주문</h2><span class="period-tag">${esc(nowYM)} 기준</span></div>
    ${notableOrders.length ? `
    <div class="notable-list">
      ${notableOrders.map(o=>`<div class="order click" data-goto-cust="${o.customer_id}">

    ${monthActs.length>8?`<p class="small muted" style="margin-top:6px">이번달 총 ${num(monthActs.length)}건 중 8건만 표시했어요.</p>`:''}

    ${summaryGroupBy==='유형별'
      ? hbars(Object.entries(byType).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>({n,v,s:won(v)})), {cat:true})
      : hbars(topCustomers)}
  </div>
  <div class="panel"><div class="panel-h"><h2>주요 품목</h2><span class="note">누적금액 상위 · 특가·공동구매 등 표기만 다른 동일 품목은 합산</span></div>

  el.querySelectorAll('[data-yr]').forEach(b=> b.onclick = ()=>{ summaryRange = b.dataset.yr; renderSummaryView(); });

}

  // 그래서 입력창은 그대로 두고, 결과 영역만 갱신합니다.
  function filtered(){
    let list = PRODUCTS;
    if(prodCat!=='전체') list = list.filter(p=>p.c===prodCat);
    const q = prodQuery.trim().toLowerCase();
    if(q) list = list.filter(p=> p.n.toLowerCase().includes(q) || p.b.toLowerCase().includes(q));
    return list;
  }
  function draw(){
    const list = filtered();
    document.getElementById('prodResult').innerHTML = `
      <div class="small muted" style="margin-bottom:6px">${num(list.length)}개 상품</div>
      <div class="tbl-wrap"><table><thead><tr><th>품명</th><th>생산시설</th><th class="num">가격</th><th></th></tr></thead><tbody>

function copyProductLine(text){
  const done = ()=> toast('복사됐어요');
  const fallback = ()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 막혀 있어요. 텍스트를 드래그해서 복사하세요'); }
    ta.remove();
  };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(e){ fallback(); }
}

// ================= 거래명세서 =================
// 일자-No를 넣으면 DB(orders)에서 불러와 '거래명세서' 양식으로 만들고, A4 한 장에 같은 명세서를 위·아래 2부씩 인쇄함.
const STM_SUPPLIER = {tel:'1666-1030', fax:'02-2647-0260', biz:'214-82-06045', rep:'이상익', name:'서울특별시립 장애인생산품판매시설', addr:'서울특별시 양천구 목동서로 33 (목동)'};
const STM_ROWS = 10;
const STM_DIG = '영일이삼사오육칠팔구';
function stmKorNum(n){
  n = Math.round(Number(n)||0); if(n===0) return '영';
  const U = ['','만','억','조']; const out=[]; let gi=0;
  while(n>0){
    const g = n%10000; n = Math.floor(n/10000);
    if(g){ let s=''; ['','십','백','천'].forEach((u,i)=>{ const d=Math.floor(g/Math.pow(10,i))%10; if(d) s = STM_DIG[d]+u+s; }); out.push(s+U[gi]); }
    gi++;
  }
  return out.reverse().join('');
}
function stmWlen(t){ let w=0; for(const ch of String(t||'')) w += ch.charCodeAt(0)>0x2E80 ? 1 : 0.55; return w; }
function stmUnits(it){ return Math.max(stmWlen(it.item_name)>31?2:1, stmWlen(it.supplier_name)>12?2:1); }
function stmChunk(items){
  const out=[]; let cur=[], u=0;
  items.forEach(it=>{ const k=stmUnits(it); if(u+k>STM_ROWS && cur.length){ out.push({items:cur,used:u}); cur=[]; u=0; } cur.push(it); u+=k; });
  out.push({items:cur,used:u}); return out;
}
function stmEmail(o){ const m = [o.delivery_note,o.reference,o.contact,o.summary].filter(Boolean).join(' ').match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/); return m?m[0]:''; }
function stmBlock(o, part, parts, used){
  const rows = o.chunkItems.map(it=>`<tr><td class="c">${esc(o.md)}</td><td class="l">${esc(it.item_name)}</td><td class="c sm">${esc(it.supplier_name)}</td><td class="r">${num(it.quantity)}</td><td class="c"></td><td class="r">${num(it.unit_price)}</td><td class="r">${num(it.supply_amount)}</td></tr>`).join('')
    + Array.from({length:Math.max(0,STM_ROWS-used)}).map(()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
  const qty = o.items.reduce((s,i)=>s+(Number(i.quantity)||0),0), amt = o.items.reduce((s,i)=>s+(Number(i.supply_amount)||0),0);
  const dept = String(o.customer).trim().split(/\s+/).pop();
  const S = STM_SUPPLIER;
  return `<div class="stm-blk">
 <div class="stm-top">
  <div class="stm-lhs"><div class="stm-ttl">거래명세서${parts>1?` (${part}/${parts})`:''}</div><div class="stm-to">${esc(o.customer)} <span class="stm-gj">귀중</span></div></div>
  <table class="stm-sup">
   <tr><td rowspan="4" class="vh">공<br>급<br>자</td><th>주문번호</th><td>${esc(o.serial)}</td><th class="tf">TEL<br>FAX</th><td class="tfv">${S.tel}<br>${S.fax}</td></tr>
   <tr><th>사업자번호</th><td>${S.biz}</td><th>성 명</th><td>${S.rep} (인)</td></tr>
   <tr><th>상 호</th><td colspan="3" class="b">${S.name}</td></tr>
   <tr><th>주 소</th><td colspan="3">${S.addr}</td></tr>
  </table>
 </div>
 <div class="stm-sum"><span>합계금액 :&nbsp; 일금&nbsp; ${stmKorNum(amt)}&nbsp; 원정</span><span>(₩ ${num(amt)}) /면세</span></div>
 <table class="stm-it gr"><thead><tr><th style="width:7%">월/일</th><th>품명 및 규격</th><th style="width:16%">생산시설</th><th style="width:6%">수량</th><th style="width:5%">단위</th><th style="width:10%">단가</th><th style="width:11%">금액</th></tr></thead><tbody>${rows}</tbody></table>
 <table class="stm-tot gr"><colgroup><col style="width:6.8%"><col style="width:11.8%"><col style="width:6.3%"><col style="width:11.9%"><col style="width:10.6%"><col style="width:12.1%"><col style="width:7.7%"><col style="width:13.2%"><col style="width:5.8%"><col style="width:13.8%"></colgroup><tr><th class="sm">주문번호</th><td></td><th>수량</th><td class="r">${num(qty)}</td><th>공급가액</th><td class="r">${num(amt)}</td><th>합계</th><td class="r">${num(amt)}</td><th>인수</th><td class="r">인</td></tr></table>
 <table class="stm-inf gr">
  <tr><th>거래처명</th><td>${esc(o.customer)}</td><th class="w2">부서명</th><td>${esc(dept)}</td></tr>
  <tr><th>주 소</th><td>${esc(o.address||'')}</td><th class="w2">Email</th><td>${esc(stmEmail(o))}</td></tr>
  <tr><th>담당자/연락처</th><td colspan="3">${esc(o.contact||'')}</td></tr>
  <tr class="tall"><th>비 고(배송지)</th><td colspan="3">${esc(o.note||'')}</td></tr>
 </table>
</div>`;
}
function stmPagesHtml(orders){
  return orders.map(o=>{
    const chunks = stmChunk(o.items);
    return chunks.map((c,i)=>{ const oo = Object.assign({}, o, {chunkItems:c.items}); const b = stmBlock(oo, i+1, chunks.length, c.used); return `<div class="stm-page">${b}<div class="stm-sep"></div>${b}</div>`; }).join('');
  }).join('');
}

// 검색할 때마다 체크한 명세서는 '선택함'에 계속 쌓이고, 마지막에 한 번에 한 파일로 인쇄/PDF 저장함.
let STM = {results:[], missing:[], cart:new Map(), previewOpen:false};
const STM_CART_KEY = 'stmCartV1';
function stmSaveCart(){ try{ localStorage.setItem(STM_CART_KEY, JSON.stringify([...STM.cart.values()])); }catch(e){} }
function stmLoadCart(){ try{ const a = JSON.parse(localStorage.getItem(STM_CART_KEY)||'[]'); (a||[]).forEach(o=>{ if(o&&o.key&&o.items) STM.cart.set(o.key,o); }); }catch(e){} }
function stmCartList(){ return [...STM.cart.values()].sort((a,b)=> a.date===b.date ? a.no-b.no : (a.date<b.date?-1:1)); }
// 입력 해석: "38, 14, 59" · "1-10" · "2026/10/07-38"(날짜까지 붙여넣기) 모두 가능
function stmParse(text, defDate){
  const pairs=[]; let t = String(text||'');
  t = t.replace(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\s*-\s*(\d+)/g, (m,y,mo,d,no)=>{ pairs.push([`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`, Number(no)]); return ' '; });
  t = t.replace(/(\d+)\s*[-~]\s*(\d+)/g, (m,a,b)=>{ a=Number(a); b=Number(b); if(b>=a && b-a<=300) for(let i=a;i<=b;i++) pairs.push([defDate,i]); return ' '; });
  (t.match(/\d+/g)||[]).forEach(n=> pairs.push([defDate, Number(n)]));
  return pairs;
}
function stmBuildOrders(rows){
  const m = new Map();
  rows.forEach(r=>{ const k=r.order_date+'|'+r.order_no; if(!m.has(k)) m.set(k,{key:k, date:r.order_date, no:r.order_no, customer:r.customer_name, address:r.address, contact:r.contact, note:r.delivery_note, reference:r.reference, delivery_note:r.delivery_note, summary:r.summary, items:[]}); m.get(k).items.push(r); });
  return [...m.values()].map(o=>{ o.items.sort((a,b)=>(a.id||0)-(b.id||0)); o.md = o.date.slice(5).replace('-','/'); o.serial = o.date.replace(/-/g,'')+' - '+o.no; o.total = o.items.reduce((s,i)=>s+(Number(i.supply_amount)||0),0); return o; })
    .sort((a,b)=> a.date===b.date ? a.no-b.no : (a.date<b.date?-1:1));
}
async function renderStmtView(){

    <div class="filters" style="align-items:flex-end">

      <label class="small muted" style="display:grid;gap:4px;flex:1 1 200px">번호 (여러 건 가능)<input type="search" id="stm-nos" placeholder="예: 38, 14, 59 · 1-10 · 2026/10/07-38"></label>
      <label class="small muted" style="display:grid;gap:4px;flex:1 1 180px">거래처 검색<input type="search" id="stm-kw" placeholder="예: 강서구, 초등학교"></label>

  el.querySelector('#stm-date').addEventListener('change', e=>{ const d2=el.querySelector('#stm-date2'); if(!d2.value || d2.value<e.target.value) d2.value=e.target.value; });

async function stmLoad(all){
  const el = document.getElementById('view-stmt');
  const msg = el.querySelector('#stm-msg');
  const d1 = el.querySelector('#stm-date').value; let d2 = el.querySelector('#stm-date2').value || d1;
  const kw = el.querySelector('#stm-kw').value.trim();
  const nosText = el.querySelector('#stm-nos').value.trim();
  if(!d1){ msg.textContent='일자를 선택해주세요.'; return; }
  if(d2<d1) d2=d1;
  if(!all && !nosText && !kw){ msg.textContent='번호나 거래처 검색어를 입력하거나 "그날 전체"를 눌러주세요.'; return; }
  msg.textContent='불러오는 중...';
  let rows=[], pairs=[];
  if(!all && nosText){
    pairs = stmParse(nosText, d1);
    const byDate = new Map();
    pairs.forEach(([d,n])=>{ if(!byDate.has(d)) byDate.set(d,new Set()); byDate.get(d).add(n); });
    for(const [d,set] of byDate){
      let q = sb.from('orders').select('*').eq('order_date', d).in('order_no', [...set]);
      if(kw) q = q.ilike('customer_name', '%'+kw+'%');
      const {data, error} = await q.order('order_no',{ascending:true}).limit(5000);
      if(error){ msg.innerHTML = `<span class="err">불러오기 실패: ${esc(error.message)}</span>`; return; }
      rows = rows.concat(data||[]);
    }
  } else {
    let q = sb.from('orders').select('*').gte('order_date', d1).lte('order_date', d2);
    if(kw && !all) q = q.ilike('customer_name', '%'+kw+'%');
    const {data, error} = await q.order('order_date',{ascending:true}).order('order_no',{ascending:true}).limit(5000);
    if(error){ msg.innerHTML = `<span class="err">불러오기 실패: ${esc(error.message)}</span>`; return; }
    rows = data||[];
  }
  STM.results = stmBuildOrders(rows);
  const have = new Set(STM.results.map(o=>o.key));
  STM.missing = pairs.filter(([d,n])=>!have.has(d+'|'+n)).map(([d,n])=>`${d.slice(5).replace('-','/')}-${n}`);
  msg.innerHTML = STM.results.length ? '' : '<span class="err">해당하는 주문이 없어요. 일자·번호·검색어를 확인해주세요.</span>';
  stmDraw();
}
function stmDraw(){
  const el = document.getElementById('view-stmt'); if(!el || !el.querySelector('#stm-list')) return;
  const list = el.querySelector('#stm-list'), cartEl = el.querySelector('#stm-cart'), prev = el.querySelector('#stm-prev');
  // --- 검색 결과 ---
  if(STM.results.length){
    const allIn = STM.results.every(o=>STM.cart.has(o.key));
    list.innerHTML = `<div class="panel">
      <div class="panel-h"><h3>검색 결과 ${num(STM.results.length)}건</h3>
        <div class="filters"><button class="btn" id="stm-toggle">${allIn?'이 결과 모두 해제':'이 결과 모두 선택'}</button></div></div>
      ${STM.missing.length?`<p class="small" style="color:var(--bad);margin:0 0 8px">찾지 못한 번호: ${esc(STM.missing.join(', '))}</p>`:''}
      <div class="tbl-wrap"><table><thead><tr><th>선택</th><th class="num">번호</th><th>거래처</th><th class="num">품목</th><th class="num">금액</th></tr></thead><tbody>
      ${STM.results.map(o=>`<tr class="${STM.cart.has(o.key)?'stm-in':''}"><td><input type="checkbox" class="stm-cb" data-k="${esc(o.key)}" ${STM.cart.has(o.key)?'checked':''}></td><td class="num">${o.md}-${o.no}</td><td style="white-space:normal">${esc(o.customer)}</td><td class="num">${o.items.length}</td><td class="num">${won(o.total)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
    list.querySelectorAll('.stm-cb').forEach(cb=> cb.onchange = ()=>{
      const o = STM.results.find(x=>x.key===cb.dataset.k); if(!o) return;
      cb.checked ? STM.cart.set(o.key,o) : STM.cart.delete(o.key);
      stmSaveCart(); stmDraw();
    });
    list.querySelector('#stm-toggle').onclick = ()=>{ STM.results.forEach(o=> allIn ? STM.cart.delete(o.key) : STM.cart.set(o.key,o)); stmSaveCart(); stmDraw(); };
  } else list.innerHTML = '';
  // --- 선택한 명세서 (여러 검색에서 모은 것) ---
  const chosen = stmCartList();
  const pages = chosen.reduce((s,o)=>s+stmChunk(o.items).length,0);
  const total = chosen.reduce((s,o)=>s+o.total,0);
  cartEl.innerHTML = `<div class="panel stm-cartbox">
    <div class="panel-h"><h3>✅ 선택한 명세서 ${num(chosen.length)}건</h3>
      <div class="filters"><span class="count-tag">${num(pages)}장 · ${won(total)}</span>
      <button class="btn" id="stm-clear" ${chosen.length?'':'disabled'}>모두 비우기</button>
      <button class="btn" id="stm-pv">${STM.previewOpen?'미리보기 닫기':'미리보기'}</button>
      <button class="btn primary" id="stm-print" ${chosen.length?'':'disabled'}>🖨️ 한 파일로 인쇄 / PDF 저장</button></div></div>
    ${chosen.length ? `<div class="stm-chips">${chosen.map(o=>`<span class="stm-chip" title="${esc(o.customer)}"><b>${o.md}-${o.no}</b> ${esc(o.customer.length>16?o.customer.slice(0,16)+'…':o.customer)} <button class="stm-x" data-k="${esc(o.key)}" aria-label="빼기">×</button></span>`).join('')}</div>`
      : '<p class="small muted" style="margin:0">위에서 검색하고 체크하면 여기에 쌓여요. 다른 번호나 거래처로 또 검색해서 체크해도 계속 쌓여요.</p>'}
    <p class="small muted" style="margin:8px 0 0">인쇄 화면에서 용지 <b>A4</b>, 배율 <b>100%</b>로 인쇄하면 한 장에 같은 명세서가 위·아래 2부 들어가요. 직인은 인쇄 후 찍어주세요. 선택 목록은 이 기기에 저장돼서 새로고침해도 남아요.</p>
  </div>`;
  cartEl.querySelectorAll('.stm-x').forEach(b=> b.onclick = ()=>{ STM.cart.delete(b.dataset.k); stmSaveCart(); stmDraw(); });
  cartEl.querySelector('#stm-clear').onclick = ()=>{ if(!confirm('선택한 명세서를 모두 비울까요?')) return; STM.cart.clear(); stmSaveCart(); stmDraw(); };
  cartEl.querySelector('#stm-pv').onclick = ()=>{ STM.previewOpen = !STM.previewOpen; stmDraw(); };
  cartEl.querySelector('#stm-print').onclick = stmPrint;
  prev.innerHTML = (STM.previewOpen && chosen.length) ? `<div class="stm stm-preview">${stmPagesHtml(chosen)}</div>` : '';
}
function stmPrint(){
  const chosen = stmCartList(); if(!chosen.length) return;
  const root = document.getElementById('stmtPrintRoot');
  root.innerHTML = `<div class="stm">${stmPagesHtml(chosen)}</div>`;
  const clear = ()=>{ root.innerHTML=''; window.removeEventListener('afterprint', clear); };
  window.addEventListener('afterprint', clear);
  setTimeout(()=>window.print(), 80);
}

};
function chStatusPill(st){ return `<span class="pill ${CH_STATUS_CLS[st]||'s-idle'}">${esc(CH_STATUS_SHORT[st]||st||'-')}</span>`; }

async function ensureCityHallLoaded(){
  if(CITYHALL.length) return CITYHALL;
  const {data, error} = await sb.from('city_hall_department_stats').select('*');
  if(error){ throw error; }
  const floorKey = f=>{
    if(!f) return 0;
    const s = String(f).replace('층','');
    if(s.startsWith('지하')){ const n = parseInt(s.replace('지하',''),10); return Number.isFinite(n) ? -n : -99; }
    const n = parseInt(s,10); return Number.isFinite(n) ? n : 0;
  };
  CITYHALL = (data||[]).slice().sort((a,b)=>{
    const bi = CH_BUILDING_ORDER.indexOf(a.building) - CH_BUILDING_ORDER.indexOf(b.building);
    if(bi) return bi;
    const di = (a.dong||'').localeCompare(b.dong||'');
    if(di) return di;
    return floorKey(b.floor) - floorKey(a.floor);
  });
  return CITYHALL;
}

function filteredCityHall(){
  let list = CITYHALL;
  if(chBuilding!=='전체') list = list.filter(r=>r.building===chBuilding);
  if(chStatus==='__opp__') list = list.filter(r=> r.status.startsWith('영업기회'));
  else if(chStatus!=='전체') list = list.filter(r=>r.status===chStatus);
  const q = chQuery.trim().toLowerCase();
  if(q) list = list.filter(r=> (r.dept_name||'').toLowerCase().includes(q) || (r.customer_name||'').toLowerCase().includes(q) || (r.building||'').toLowerCase().includes(q));
  return list;
}
