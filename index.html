  body.innerHTML = '<div class="panel"><p class="small muted">불러오는 중...</p></div>';
  const {data, error} = await sb.from('edu_office_program').select('*').order('edu_office');
  if(error){ body.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  let sel = (data && data[0]) ? data[0].edu_office : null;
  function draw(){
    const cur = data.find(e=>e.edu_office===sel);
    const ids = (cur.non_participant_ids||[]).map(id=>custById.get(id)).filter(Boolean).sort((a,b)=>(b.total_amount||0)-(a.total_amount||0));
    body.innerHTML = `<div class="panel">
      <div class="panel-h"><h2>교육지원청별 공동구매·연간단가 참여 현황</h2></div>
      <p class="explain">교육지원청 소속 거래처 중, 해당 교육지원청의 공동구매나 연간단가(특가) 품목을 <b>한 번도 주문하지 않은 곳</b>이에요. 다음 공동구매 안내 대상입니다. (마지막 데이터 갱신 시점 기준)</p>
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>교육지원청</th><th class="num">거래처</th><th class="num">참여</th><th class="num">미참여</th><th>참여율</th><th class="num">누적 금액</th></tr></thead><tbody>
      ${data.map(e=>`<tr class="click" data-eo="${esc(e.edu_office)}" ${e.edu_office===sel?'style="background:var(--accent-soft)"':''}><td>${esc(e.edu_office)}</td><td class="num">${e.total_customers}</td><td class="num">${e.participating}</td><td class="num">${e.total_customers-e.participating}</td><td class="num">${Math.round(e.participating/e.total_customers*100)}%</td><td class="num">${won(e.total_amount)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h2>${esc(sel)} 교육지원청 미참여 거래처 ${num(ids.length)}곳</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>거래처</th><th>상태</th><th class="num">누적 금액</th></tr></thead><tbody>
      ${ids.map(c=>`<tr class="click" data-id="${c.customer_id}"><td>${esc(c.name)}</td><td>${statusPill(c.status)}</td><td class="num">${won(c.total_amount)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
    body.querySelectorAll('[data-eo]').forEach(r=>r.onclick=()=>{ sel=r.dataset.eo; draw(); });
    body.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> openDrawer(Number(tr.dataset.id)) );
  }
  if(!data || !data.length){ body.innerHTML = '<div class="panel"><p class="small muted">데이터가 없습니다.</p></div>'; return; }
  draw();
}

async function renderGift(){
  const body = document.getElementById('salesBody');
  body.innerHTML = '<div class="panel"><p class="small muted">불러오는 중...</p></div>';
  const {data, error} = await sb.from('gift_customers').select('*');
  if(error){ body.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  const rows = (data||[]).map(r=>({...r, c: custById.get(r.customer_id)})).filter(r=>r.c);
  const onlySeol = rows.filter(r=>r.seol_amount>0 && r.chuseok_amount<=0);
  const rest = rows.filter(r=>!(r.seol_amount>0 && r.chuseok_amount<=0));
  onlySeol.sort((a,b)=>(b.seol_amount)-(a.seol_amount));
  rest.sort((a,b)=>((b.seol_amount||0)+(b.chuseok_amount||0))-((a.seol_amount||0)+(a.chuseok_amount||0)));
  const ordered = onlySeol.concat(rest);
  body.innerHTML = `<div class="panel">
    <div class="panel-h"><h2>명절 선물세트 구매 거래처</h2></div>
    <p class="explain">설·추석 선물세트를 주문한 곳이에요. <b>가장 최근 설엔 샀는데 그 다음 추석엔 안 산 곳 ${num(onlySeol.length)}곳</b>은 위쪽에 모았어요 — 다음 설 영업 리스트로 쓰세요.</p>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>거래처</th><th class="num">최근 설</th><th class="num">최근 추석</th><th class="num">누적 금액</th></tr></thead><tbody>
    ${ordered.map(r=>`<tr class="click" data-id="${r.customer_id}"><td>${esc(r.c.name)} ${r.seol_amount>0&&r.chuseok_amount<=0?'<span class="pill s-warn">추석 미구매</span>':''}</td><td class="num">${r.seol_amount?won(r.seol_amount):'—'}</td><td class="num">${r.chuseok_amount?won(r.chuseok_amount):'—'}</td><td class="num">${won(r.c.total_amount)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  body.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> openDrawer(Number(tr.dataset.id)) );
}

// 기관유형별로 "지금이 연락하기 좋은 시점"인지: 학교류는 방학 끝난 신학기 초(3월·9월), 공공기관류는
// 예산 집행 초반(3~4월)과 연말 예산 소진기(9~12월)를 좋은 타이밍으로 봄. 복지시설·기업 등 정해진
// 주기가 뚜렷하지 않은 유형은 타이밍 보너스를 주지 않음.
const TIMING_GOOD_MONTHS = {
  '유치원·어린이집':[3,9], '초등학교':[3,9], '중학교':[3,9], '고등학교':[3,9], '특수·기타학교':[3,9], '교육청·도서관':[3,9],
  '구청':[3,4,9,10,11,12], '서울시 본청·사업소':[3,4,9,10,11,12], '중앙부처·공공기관':[3,4,9,10,11,12],
  '공사·공단':[3,4,9,10,11,12], '동주민센터':[3,4,9,10,11,12], '소방':[3,4,9,10,11,12], '경찰':[3,4,9,10,11,12], '법무·사법':[3,4,9,10,11,12],
};
function timingGood(ctype){ const months = TIMING_GOOD_MONTHS[ctype]; return months ? months.includes(new Date().getMonth()+1) : false; }
const SCHOOL_CTYPES = ['유치원·어린이집','초등학교','중학교','고등학교','특수·기타학교'];

// 이탈의심+주의가 1000곳이 넘어 어디부터 손댈지 막막하다는 요청으로 추가한 뷰.
// 기존 '영업 우선순위'(로그스케일로 완만하게 반영)와 중복된다는 피드백을 받아 그 쪽을 없애고,
// 이 뷰 하나에 상태 위험도·지연 정도·타이밍까지 전부 합치면서, 주문수·금액만큼은 일부러 로그로 누르지 않고
// 그대로 반영 — "컸던 곳이 끊기면 확실히 위로" 올라오게 한 게 핵심 차이.
// ===== 오늘의 영업대상: 상위 카테고리를 날마다 돌려가며 10~15곳씩 추천 =====
// 영업 담당이 같은 종류의 기관을 묶어서 연락하도록 상위 6개 카테고리로 나누고, 영업일(월~금) 순서대로 하루에 한 카테고리씩 보여줌.
const CAT_GROUPS = [
  {key:'school',  name:'학교·교육',   icon:'🏫', types:['유치원·어린이집','초등학교','중학교','고등학교','특수·기타학교','교육청·도서관']},
  {key:'central', name:'중앙부처·국회', icon:'🏛️', types:['중앙부처·공공기관']},
  {key:'seoul',   name:'서울시·구청',  icon:'🏙️', types:['서울시 본청·사업소','구청','동주민센터']},
  {key:'public',  name:'공기업·공공',  icon:'🏢', types:['공사·공단','재단·협회']},
  {key:'safety',  name:'안전·보건',   icon:'🚒', types:['소방','경찰','법무·사법','의료·보건']},
  {key:'welfare', name:'복지·기업',   icon:'🤝', types:['복지시설','기업','기타','개인·일반소비자']},
];
const CAT_OF = {}; CAT_GROUPS.forEach(g=>g.types.forEach(t=>{ CAT_OF[t]=g.key; }));
const CORE_PER_DAY = 12;      // 하루에 보여줄 곳 수 (10~15)
const CORE_FIXED = 3;         // 점수 상위 몇 곳은 매일 고정, 나머지는 날짜로 순환
const CORE_ROTATE_POOL = 30;  // 순환 후보 폭
const CORE_COOLDOWN_DAYS = 14; // 연락한 곳은 이 기간 쉬게 함 (다음 연락일을 정했으면 그 날 다시)
// 연락 결과 → 다음 연락까지 쉬는 일수
const OUTCOMES = [
  {k:'connected',      label:'통화 연결', next:14, cls:'ok'},
  {k:'no_answer',      label:'부재중',   next:3,  cls:'idle'},
  {k:'order_promised', label:'주문 약속', next:7,  cls:'good'},
  {k:'declined',       label:'거절',     next:60, cls:'bad'},
];
const OUTCOME_LABEL = {connected:'통화 연결', no_answer:'부재중', order_promised:'주문 약속', declined:'거절·관심없음', other_supplier:'타 업체 이용', contact_changed:'담당자 변경'};
let coreCatKey = null; // null이면 오늘의 카테고리

function localYmd(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function addDaysYmd(n){ const d=new Date(); d.setDate(d.getDate()+n); return localYmd(d); }
// 월~금만 세는 영업일 번호 (토·일은 다음 월요일로 간주) — 6개 카테고리가 공평하게 돌아감
function businessDayIndex(date){
  const x = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  while(x.getDay()===0 || x.getDay()===6) x.setDate(x.getDate()+1);
  const base = new Date(2026,0,5); // 월요일
  const days = Math.round((x-base)/86400000);
  return Math.floor(days/7)*5 + (x.getDay()-1);
}
function todayCatIndex(){ const i = businessDayIndex(new Date()) % CAT_GROUPS.length; return i<0 ? i+CAT_GROUPS.length : i; }
function seededRand(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){ const r=seededRand(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function renderCoreTargets(){
  const body = document.getElementById('salesBody');
  body.innerHTML = '<div class="panel"><p class="small muted">불러오는 중...</p></div>';
  const pool = CUSTS.filter(c=>['이탈의심','주의'].includes(c.status));
  // 이 그룹(이탈의심+주의) 안에서 주문수·누적금액 각각의 백분위를 매김 — 로그스케일을 쓰지 않아 '컸던 곳'이 확실히 위로 옴.
  const rankPct = (arr, key) => {
    const sorted = arr.slice().sort((a,b)=>(Number(a[key])||0)-(Number(b[key])||0));
    const m = new Map();
    sorted.forEach((c,i)=> m.set(c.customer_id, sorted.length>1 ? i/(sorted.length-1) : 1));
    return m;
  };
  const ocRank = rankPct(pool, 'order_count');
  const amtRank = rankPct(pool, 'total_amount');
  const nowMonth = new Date().getMonth()+1;
  const scored = pool.map(c=>{
    const ocP = ocRank.get(c.customer_id)||0, amtP = amtRank.get(c.customer_id)||0;
    const volumeScore = Math.max(ocP, amtP);
    const why = ocP>=amtP ? '주문수' : '금액';
    const riskW = c.status==='이탈의심' ? 1.2 : 1;
    const cyc = Number(c.typical_cycle_days)||0;
    const sn = Number(c.days_since_last_order)||0;
    const overdueX = cyc ? sn/cyc : null;
    const overdueScore = Math.min(overdueX!=null?overdueX:3, 8) / 8;
    const timing = timingGood(c.ctype);
    const onVacation = SCHOOL_CTYPES.includes(c.ctype) && (nowMonth===7 || nowMonth===8);
    const score = (volumeScore*0.7 + overdueScore*0.3) * riskW * (timing?1.15:1) * (onVacation?0.85:1);
    return Object.assign({}, c, {_ocP:ocP, _amtP:amtP, _why:why, _overdueX:overdueX, _timing:timing, _onVacation:onVacation, _score:score});
  }).sort((a,b)=>b._score-a._score);

  // 최근 연락 기록 (쉬게 할 곳 / 약속한 날이 된 곳 / 오늘 연락한 수)
  const todayStr = localYmd(new Date());
  const since = new Date(); since.setDate(since.getDate()-90);
  const {data: acts} = await sb.from('activities').select('customer_id,created_at,next_contact_date,outcome').gte('created_at', since.toISOString()).order('created_at',{ascending:false}).limit(3000);
  const lastAct = new Map();
  (acts||[]).forEach(a=>{ if(!lastAct.has(a.customer_id)) lastAct.set(a.customer_id, a); }); // 최신순이라 처음 걸리는 게 가장 최근
  const doneToday = (acts||[]).filter(a=> localYmd(new Date(a.created_at))===todayStr).length;

  const todayIdx = todayCatIndex();
  const cat = CAT_GROUPS.find(g=>g.key===coreCatKey) || CAT_GROUPS[todayIdx];
  const isToday = cat===CAT_GROUPS[todayIdx];
  const inCat = scored.filter(c=>CAT_OF[c.ctype]===cat.key);
  // 연락한 지 얼마 안 된 곳은 쉬게 하고, 다음 연락일이 오늘 이전이면 '약속한 날'로 맨 위에
  const cooling = c=>{
    const a = lastAct.get(c.customer_id); if(!a) return false;
    if(a.next_contact_date && a.next_contact_date<=todayStr) return false;
    if(a.next_contact_date && a.next_contact_date>todayStr) return true;
    return (Date.now()-new Date(a.created_at).getTime()) < CORE_COOLDOWN_DAYS*86400000;
  };
  const due = inCat.filter(c=>{ const a=lastAct.get(c.customer_id); return a && a.next_contact_date && a.next_contact_date<=todayStr; }).map(c=>Object.assign(c,{_due:true}));
  const dueIds = new Set(due.map(c=>c.customer_id));
  const rest = inCat.filter(c=>!dueIds.has(c.customer_id) && !cooling(c));
  const coolingCount = inCat.length - rest.length - due.length;
  const dayKey = Number(todayStr.replace(/-/g,''));
  const catIdx = CAT_GROUPS.indexOf(cat);
  const fixed = rest.slice(0, CORE_FIXED);
  const rotPool = rest.slice(CORE_FIXED, CORE_FIXED+CORE_ROTATE_POOL);
  const rotated = seededShuffle(rotPool, dayKey*10+catIdx);
  const list = due.concat(fixed, rotated).slice(0, Math.max(CORE_PER_DAY, due.length));

  // 선택된 곳에만 재주문 예상·추가구매 추천 팁을 붙임
  const ids = list.map(c=>c.customer_id);
  const ctypes = [...new Set(list.map(c=>c.ctype).filter(Boolean))];
  const [{data: fam}, {data: pen}, {data: haveRows}] = ids.length ? await Promise.all([
    sb.from('item_family_stats').select('*').in('customer_id', ids).in('status', ['정상','임박','지연']).order('next_date', {ascending:true}),
    sb.from('item_type_penetration').select('*').in('ctype', ctypes).order('penetration_pct', {ascending:false}).limit(3000),
    sb.from('item_customer_stats').select('customer_id,item_name').in('customer_id', ids),
  ]) : [{data:[]},{data:[]},{data:[]}];
  const nextByCust = new Map();
  (fam||[]).forEach(r=>{ if(!nextByCust.has(r.customer_id)) nextByCust.set(r.customer_id, r); });
  const haveByCust = new Map();
  (haveRows||[]).forEach(r=>{ if(!haveByCust.has(r.customer_id)) haveByCust.set(r.customer_id, new Set()); haveByCust.get(r.customer_id).add(r.item_name); });
  const penByType = new Map();
  (pen||[]).forEach(r=>{ if(!penByType.has(r.ctype)) penByType.set(r.ctype, []); penByType.get(r.ctype).push(r); });
  list.forEach(c=>{
    c._next = nextByCust.get(c.customer_id) || null;
    const have = haveByCust.get(c.customer_id) || new Set();
    c._reco = (penByType.get(c.ctype)||[]).find(r=>!have.has(r.item_name)) || null;
  });

  function tipLines(c){
    const t = [];
    if(c._due) t.push('📅 약속한 연락일이 됐어요');
    t.push(c._why==='금액'
      ? `누적 ${won(c.total_amount)} — 이탈의심·주의 ${num(pool.length)}곳 중 금액 상위 ${Math.max(1,Math.round((1-c._amtP)*100))}%`
      : `주문 ${num(c.order_count)}회 — 이탈의심·주의 ${num(pool.length)}곳 중 주문수 상위 ${Math.max(1,Math.round((1-c._ocP)*100))}%`);
    t.push(c._overdueX!=null
      ? `평소 ${Math.round(c.typical_cycle_days)}일 주기인데 ${num(c.days_since_last_order)}일째 (평소의 ${c._overdueX.toFixed(1)}배)`
      : `마지막 주문 후 ${num(c.days_since_last_order)}일째`);
    t.push(c.status==='이탈의심' ? '전화보다 방문·이메일 등 적극적인 컨택이 효과적이에요' : '아직 늦은 정도는 가벼워요 — 안부 전화 정도로 충분해요');
    if(c._onVacation) t.push('학교 방학(7~8월) 중이라 일시적으로 뜸한 걸 수 있어요 — 개학(9월) 전후 재확인');
    else if(c._timing) t.push('지금이 이 기관유형 연락하기 좋은 시점이에요');
    if(c._next) t.push(`🔁 '${c._next.item_name}' 곧 재주문 예상 (${c._next.next_date} 경, 평소 ${c._next.cycle_days}일 주기) — 연락할 때 같이 챙기세요`);
    if(c._reco) t.push(`➕ 아직 안 산 '${c._reco.item_name}' 권해보세요 (동종 ${c.ctype||''} ${c._reco.penetration_pct}% 구매)`);
    return t;
  }

  const dow = ['일','월','화','수','목','금','토'][new Date().getDay()];
  const nowD = new Date();
  const dateLabel = `${nowD.getMonth()+1}월 ${nowD.getDate()}일 (${dow})`;
  const chips = CAT_GROUPS.map((g,i)=>{
    const n = scored.filter(c=>CAT_OF[c.ctype]===g.key).length;
    return `<button class="chip" data-cat="${g.key}" aria-pressed="${g===cat}">${g.icon} ${esc(g.name)} <span class="muted small">${num(n)}</span>${i===todayIdx?' <span class="today-dot">오늘</span>':''}</button>`;
  }).join('');
  const outBtns = c=>`<div class="outbtns">${OUTCOMES.map(o=>`<button class="outbtn ${o.cls}" data-o="${o.k}" data-cid="${c.customer_id}">${esc(o.label)}</button>`).join('')}</div>`;

  body.innerHTML = `<div class="panel">

// success-window in days used for "영업 성공" matching
const OUTCOME_WINDOW_DAYS = 14;
function computeOutcome(activityDateStr, orderDates){
  // orderDates: array of 'YYYY-MM-DD' strings for that customer
  const a = new Date(activityDateStr+'T00:00:00');
  const end = new Date(a.getTime() + OUTCOME_WINDOW_DAYS*86400000);
  const today = new Date(new Date().toISOString().slice(0,10)+'T00:00:00');
  let hit = null;
  for(const ds of orderDates){
    const d = new Date(ds+'T00:00:00');
    if(d>=a && d<=end){ if(!hit || d<hit) hit = d; }
  }
  if(hit) return {state:'ok', date: hit.toISOString().slice(0,10)};
  if(today <= end) return {state:'pending'};
  return {state:'none'};
}

async function renderContactOutcome(){
  const body = document.getElementById('salesBody');
  body.innerHTML = '<div class="spin">불러오는 중...</div>';
  const {data: acts, error} = await sb.from('activities')
    .select('id,customer_id,kind,note,created_at,author_id,profiles(name),customers(name)')
    .in('kind', ['call','visit','sms'])
    .order('created_at', {ascending:false})
    .limit(500);
  if(error){ body.innerHTML = `<div class="panel">불러오기 실패: ${esc(error.message)}</div>`; return; }
  if(!acts || acts.length===0){
    body.innerHTML = `<div class="panel"><div class="panel-h"><h2>연락 성과</h2></div><p class="lede small muted">아직 기록된 통화·방문·문자가 없어요. 거래처 상세에서 기록을 남기면 여기서 성공률을 볼 수 있어요.</p></div>`;
    return;
  }
  const custIds = [...new Set(acts.map(a=>a.customer_id))];
  const {data: ords} = await sb.from('orders').select('customer_id,order_date').in('customer_id', custIds);
  const ordersByCust = new Map();
  (ords||[]).forEach(o=>{ if(!ordersByCust.has(o.customer_id)) ordersByCust.set(o.customer_id, []); ordersByCust.get(o.customer_id).push(o.order_date); });

  const rows = acts.map(a=>{
    const ds = a.created_at.slice(0,10);
    const outcome = computeOutcome(ds, ordersByCust.get(a.customer_id)||[]);
    return {...a, ds, outcome};
  });
  const total = rows.length;
  const ok = rows.filter(r=>r.outcome.state==='ok').length;
  const pending = rows.filter(r=>r.outcome.state==='pending').length;
  const decided = total - pending;
  const rate = decided>0 ? Math.round(ok/decided*100) : 0;

  const byAuthor = new Map();
  rows.forEach(r=>{
    const key = r.author_id;
    if(!byAuthor.has(key)) byAuthor.set(key, {name: (r.profiles&&r.profiles.name)||'(알수없음)', total:0, ok:0, decided:0});
    const e = byAuthor.get(key); e.total++;
    if(r.outcome.state!=='pending'){ e.decided++; if(r.outcome.state==='ok') e.ok++; }
  });
  const authorRows = [...byAuthor.values()].sort((a,b)=>b.total-a.total);

  body.innerHTML = `
    <div class="panel">
      <div class="panel-h"><h2>연락 성과</h2><span class="note">통화·방문·문자 후 ${OUTCOME_WINDOW_DAYS}일 이내 주문이 들어오면 "성공"으로 판단</span></div>
      <div class="kpis">
        <div class="kpi"><div class="l">총 접촉</div><div class="v">${num(total)}</div></div>
        <div class="kpi"><div class="l">성공</div><div class="v">${num(ok)}</div></div>
        <div class="kpi"><div class="l">성공률</div><div class="v">${decided>0? rate+'%' : '-'}</div><div class="s">판정 완료 ${num(decided)}건 기준</div></div>
        <div class="kpi"><div class="l">대기중</div><div class="v">${num(pending)}</div><div class="s">${OUTCOME_WINDOW_DAYS}일 아직 안 지남</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>담당자별</h3></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>담당자</th><th class="num">접촉수</th><th class="num">성공</th><th class="num">성공률</th></tr></thead>
        <tbody>${authorRows.map(a=>`<tr><td>${esc(a.name)}</td><td class="num">${num(a.total)}</td><td class="num">${num(a.ok)}</td><td class="num">${a.decided>0? Math.round(a.ok/a.decided*100)+'%':'-'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>최근 기록</h3></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>날짜</th><th>거래처</th><th>구분</th><th>담당자</th><th>결과</th></tr></thead>
        <tbody>${rows.slice(0,100).map(r=>`<tr class="click" data-id="${r.customer_id}">
          <td>${r.ds}</td><td>${esc((r.customers&&r.customers.name)||'')}</td>
          <td>${LOG_TYPE[r.kind]||r.kind}</td>
          <td>${esc((r.profiles&&r.profiles.name)||'')}</td>
          <td>${outcomeBadge(r.outcome)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  body.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> openDrawer(Number(tr.dataset.id)) );
}

function outcomeBadge(o){
  if(o.state==='ok') return `<span class="log-outcome ok">주문 성공 (${o.date})</span>`;
  if(o.state==='pending') return `<span class="log-outcome pending">대기중</span>`;
  return `<span class="log-outcome none">성과 없음</span>`;
}

function salesTipHTML(c){
  const md_ = c.typical_cycle_days!=null ? Math.round(c.typical_cycle_days) : null;
  const sn = c.days_since_last_order;
  let situation;
  if(c.status==='이탈의심'){
    situation = md_ ? `보통 ${md_}일마다 주문하시던 곳인데 ${sn}일째 소식이 없어요 (평소 주기의 ${(sn/md_).toFixed(1)}배).` : `${sn}일째 주문이 없어요.`;
  } else if(c.status==='주의'){
    situation = md_ ? `보통 ${md_}일 주기인데 지금 ${sn}일째로 살짝 늦어지고 있어요. 아직 이탈은 아니고 먼저 챙기면 좋은 단계예요.` : `주문이 평소보다 살짝 늦어지고 있어요 (${sn}일째).`;
  } else if(c.status==='휴면'){
    situation = `2번 주문 후 ${sn}일간 소식이 없어요. 초반 관계를 다시 살려볼 만한 곳이에요.`;
  } else {
    situation = `지금까지 딱 한 번(${c.last_date||''}) 주문하고 이어지지 않았어요. 그때 경험이 어땠는지 확인해볼 만해요.`;
  }
  const tip = SALES_TIP[c.ctype] || '주문 이력을 참고해서 자연스러운 타이밍에 연락해보세요.';
  return `<div class="panel">
    <div class="panel-h"><h3>영업 참고</h3><span class="note">전화·방문 전에 참고하세요</span></div>
    <p class="explain">${esc(situation)}<br>💡 ${esc(tip)}</p>
  </div>`;
}
// 이 거래처에 한해서, 영업 탭의 핵심 영업대상(재주문 예상·추가구매 추천 팁)·이탈 감지(품목 끊김 포함)가
// 쓰는 것과 완전히 같은 기준으로 계산한 품목별 근거를 보여줌 — "거래처별로도 설명이 상세했으면 좋겠다"는
// 요청에 맞춰, 패널에서 보던 판정을 그 거래처 하나로 좁혀서 구체적인 품목명·날짜·숫자로 보여준다.
function salesDetailHTML(c, itemStats, recoRows, itemStatsSku){
  const stats = itemStats || [];
  const stopped = stats.filter(r=>r.status==='끊김의심').sort((a,b)=>(b.total_amount||0)-(a.total_amount||0));
  const delayed = stats.filter(r=>r.status==='지연').sort((a,b)=>(b.total_amount||0)-(a.total_amount||0));
  const upcoming = stats.filter(r=>r.status==='임박').sort((a,b)=> (a.next_date<b.next_date?-1:1));
  // 추천(미구매 품목) 제외 목록은 핵심 영업대상의 추가구매 추천 팁과 같은 기준(정확한 품목명)으로 맞춰서 비교
  const have = new Set((itemStatsSku||stats).map(r=>r.item_name));
  const recos = (recoRows||[]).filter(r=>!have.has(r.item_name)).slice(0,3);

  const li = (arr, fmt) => arr.slice(0,5).map(r=>`<li>${fmt(r)}</li>`).join('');
  const sections = [];
  if(stopped.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🔴 끊긴 것으로 보이는 품목 (${stopped.length}개)</b>
      <div class="small muted">평소 주기의 3배(또는 75일) 넘게 안 산 품목 — 다른 곳에서 사고 있을 가능성</div>
      <ul class="small" style="margin:6px 0 0 18px">${li(stopped, r=>`${esc(r.item_name)} — 평소 ${r.cycle_days}일 주기인데 ${r.since_days}일째 없음 (누적 ${won(r.total_amount)})`)}</ul></div>`);
  }
  if(delayed.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🟡 늦어지고 있는 품목 (${delayed.length}개)</b>
      <ul class="small" style="margin:6px 0 0 18px">${li(delayed, r=>`${esc(r.item_name)} — 예상일 ${r.next_date}보다 늦어지는 중 (평소 ${r.cycle_days}일 주기)`)}</ul></div>`);
  }
  if(upcoming.length){
    sections.push(`<div style="margin-top:10px"><b class="small">🟢 곧 재주문할 것으로 보이는 품목 (${upcoming.length}개)</b>
      <ul class="small" style="margin:6px 0 0 18px">${li(upcoming, r=>`${esc(r.item_name)} — 예상일 ${r.next_date}${r.usual_qty?` (보통 ${num(r.usual_qty)}개)`:''}`)}</ul></div>`);
  }
  if(recos.length){
    sections.push(`<div style="margin-top:10px"><b class="small">💡 같은 유형 기관이 많이 사는 미구매 품목</b>
      <ul class="small" style="margin:6px 0 0 18px">${recos.map(r=>`<li>${esc(r.item_name)} — 동종(${esc(c.ctype||'')}) 구매율 ${r.penetration_pct}%</li>`).join('')}</ul></div>`);
  }
  if(!sections.length) return '';
  return `<div class="panel">
    <div class="panel-h"><h3>이 거래처의 품목별 근거</h3><span class="note">영업 탭과 같은 기준</span></div>
    ${sections.join('')}
  </div>`;
}

// orders 테이블은 한 품목이 한 줄이라, 같은 날짜+주문번호(order_no)를 묶어야 실제 주문 1건이 됨.
// order_no가 없는 옛날 데이터는 그냥 각 줄을 독립된 주문으로 취급.
function groupOrders(orders){
  const map = new Map();
  (orders||[]).forEach(o=>{
    const key = (o.order_no!=null && o.order_no!=='') ? `${o.order_date}__${o.order_no}` : `row_${o.id}`;
    if(!map.has(key)) map.set(key, {order_date:o.order_date, order_no:o.order_no, address:o.address, contact:o.contact, delivery_note:o.delivery_note, summary:o.summary, status:o.status, items:[], total:0});
    const g = map.get(key);
    g.items.push(o);
    g.total += Number(o.supply_amount)||0;
  });
  return [...map.values()].sort((a,b)=>{
    if(a.order_date!==b.order_date) return a.order_date<b.order_date?1:-1;
    return (Number(b.order_no)||0)-(Number(a.order_no)||0);
  });
}

    sb.from('orders').select('order_date,supply_amount,order_no').eq('customer_id', custId),

    sb.from('item_family_stats').select('*').eq('customer_id', custId).then(r=>r, ()=>({data:[]})),

    c.ctype ? sb.from('item_type_penetration').select('*').eq('ctype', c.ctype).order('penetration_pct', {ascending:false}).limit(30).then(r=>r, ()=>({data:[]})) : Promise.resolve({data:[]})
  ]);
  const orderDates = (orders||[]).map(o=>o.order_date);
  const byMonth = new Map();
  const orderKeysByMonth = new Map(); // 월별 실제 "주문 건수"(날짜+주문번호 조합) 집계 — 기간별 주문수 KPI에 씀

      </div>
      <div class="panel">
        <div class="panel-h"><h3>최근 주문 (${orderGroups.length}건)</h3><span class="note">눌러서 품목·담당자 연락처 보기</span></div>
        ${orderGroups.map((g,i)=>`<div class="order click" data-og="${i}">
          <div class="order-h"><b>${esc(g.order_date||'')}</b> <span class="small muted">품목 ${g.items.length}개${g.summary?` · ${esc(g.summary)}`:''}</span> <span class="amt">${won(g.total)}</span></div>
          ${g.address?`<div class="ship">${esc(g.address)}</div>`:''}
        </div>`).join('') || '<p class="small muted">주문 이력이 없습니다.</p>'}
      </div>
      <div class="panel" id="logPanel"></div>`;
    body.querySelectorAll('[data-yr]').forEach(b=> b.onclick = ()=>{ custRange = b.dataset.yr; drawBody(); });
    body.querySelectorAll('[data-og]').forEach(el=> el.onclick = ()=> openOrderDetail(orderGroups[Number(el.dataset.og)]) );
    const umbrellaBtn = document.getElementById('umbrellaGotoBtn');
    if(umbrellaBtn) umbrellaBtn.onclick = ()=>{ close(); gotoCustomersByQuery(c.name); };
    renderLogSection(custId, acts||[], orderDates);
  }
  drawBody();
}

function renderLogSection(custId, acts, orderDates){
  const panel = document.getElementById('logPanel');
  if(!panel) return;
  panel.innerHTML = `
    <div class="panel-h"><h3>통화·방문·문자 기록</h3><span class="period-tag">${acts.length}건</span></div>
    <div id="logList">${acts.map(a=>logItemHTML(a, orderDates)).join('') || '<p class="small muted">아직 기록이 없습니다.</p>'}</div>
    <div class="log-form" style="margin-top:12px">
      <div class="row">
        <select id="log-kind">
          <option value="call">전화</option>
          <option value="visit">방문</option>
          <option value="sms">문자</option>
        </select>
        <label class="small">다음 연락 예정일 <input type="date" id="log-next"></label>
      </div>
      <textarea id="log-note" placeholder="통화·방문·문자 내용을 남겨주세요"></textarea>
      <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="log-submit">기록 남기기</button></div>
      <div id="log-msg"></div>
    </div>`;
  panel.querySelectorAll('.log-del').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('이 기록을 삭제할까요?')) return;
      const id = btn.dataset.id;
      const {error} = await sb.from('activities').delete().eq('id', id);
      if(error){ alert('삭제 실패: '+error.message); return; }
      const {data: acts2} = await sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false});
      renderLogSection(custId, acts2||[], orderDates);
    };
  });
  document.getElementById('log-submit').onclick = async ()=>{
    const kind = document.getElementById('log-kind').value;
    const note = document.getElementById('log-note').value.trim();
    const next = document.getElementById('log-next').value || null;
    const msg = document.getElementById('log-msg');
    if(!note){ msg.innerHTML = '<div class="err small">내용을 입력해주세요.</div>'; return; }
    const {error} = await sb.from('activities').insert({customer_id: custId, kind, note, next_contact_date: next});
    if(error){ msg.innerHTML = `<div class="err small">저장 실패: ${esc(error.message)}</div>`; return; }
    const c = custById.get(custId);
    const {data: orders2} = await sb.from('orders').select('order_date').eq('customer_id', custId);
    const newOrderDates = (orders2||[]).map(o=>o.order_date);
    const {data: acts2} = await sb.from('activities').select('id,kind,note,next_contact_date,created_at,author_id,profiles(name)').eq('customer_id', custId).order('created_at', {ascending:false});
    renderLogSection(custId, acts2||[], newOrderDates);
  };
}

const LOG_TYPE = {call:'전화', visit:'방문', sms:'문자'};
function logItemHTML(a, orderDates){
  const ds = a.created_at.slice(0,10);
  const outcome = computeOutcome(ds, orderDates);
  const mine = ME && a.author_id===ME.id;
  const canDel = mine || (ME && ME.role==='admin');
  return `<div class="log-item">
    <div class="log-h">
      <span class="tag">${LOG_TYPE[a.kind]||a.kind}</span>
      <span class="who">${esc((a.profiles&&a.profiles.name)||'')} · ${ds}</span>
      ${outcomeBadge(outcome)}
      ${canDel? `<button class="log-del" data-id="${a.id}">삭제</button>` : ''}
    </div>
    <div class="log-note">${esc(a.note)}</div>
    ${a.next_contact_date? `<div class="log-next">다음 연락 예정: ${a.next_contact_date}</div>` : ''}
  </div>`;
}
</script>
